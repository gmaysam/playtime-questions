<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Paraxilingo">
<link rel="apple-touch-icon" href="icon180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E6F3FF">
<title>Paraxilingo C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>:root {
  --ink:#3B2A1E;
  --ink-soft:#7A6552;
  --paper:#FFFFFF;
  --mist:#F6EEDF;
  --line:#EADCC4;
  --beaver:#D9772E;
  --beaver-deep:#9E5320;
  --beaver-tint:#FBEBDB;
  --leaf:#6BA539;
  --leaf-deep:#4A7A22;
  --leaf-tint:#EAF3DA;
  --berry:#D4593A;
  --berry-deep:#A23E22;
  --berry-tint:#FBE6DE;
  --sun:#F2B533;
  --sun-deep:#BD8516;
  --sun-tint:#FCF1D3;
  --sky:#3C8EC0;
  --sky-deep:#276A93;
  --sky-tint:#E1EFF7;
  --wood:#B87B42;
  --wood-deep:#7A4A1E;
  --grape:#A05CF0;
  --grape-deep:#7B3BCB;
  --grape-tint:#F1E6FF;
  --stone:#C8C6D3;
  --stone-deep:#9A97AB;
  --desk:#1E2A44;
  --f-display:"Fredoka","M PLUS Rounded 1c",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"M PLUS Rounded 1c",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme: light;
}
* {
  box-sizing: border-box;
}
[hidden] {
  display: none !important;
}
html,
body {
  height: 100%;
}
body {
  margin: 0;
  background: var(--desk);
  color: var(--ink);
  font-family: var(--f-body);
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  border: 0;
  background: none;
  padding: 0;
}
button:focus-visible {
  outline: 3px solid var(--sky);
  outline-offset: 3px;
}
.stage {
  height: 100%;
  display: grid;
  place-items: center;
  grid-template-rows: 100%;
  grid-template-columns: 100%;
}
.phone {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 0;
  max-height: 100%;
  background: var(--paper);
  overflow: hidden;
  overflow: clip;
  display: flex;
  flex-direction: column;
}
.island,
.statusbar {
  display: none;
}
@media (min-width:560px) and (min-height:720px) and (hover:hover) and (pointer:fine) {
  .stage {
    background:
      radial-gradient(
        1200px 600px at 70% 10%,
        #2F4775 0%,
        transparent 60%),
      var(--desk);
  }
  .stage {
    grid-template-columns: auto;
  }
  .phone {
    width: 390px;
    height: min(844px, calc(100% - 40px));
    border-radius: 56px;
    border: 11px solid #0E0E14;
    box-shadow: 0 0 0 2px #3A3A48, 0 40px 80px rgba(0, 0, 0, .45);
  }
  .island {
    display: block;
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 118px;
    height: 34px;
    border-radius: 20px;
    background: #0E0E14;
    z-index: 90;
  }
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 46px;
    padding: 0 30px;
    font-weight: 900;
    font-size: 15px;
    background: var(--paper);
    flex: none;
  }
  .statusbar .sig {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .over {
    top: 46px !important;
  }
}
.bv {
  position: relative;
  display: inline-block;
  line-height: 0;
  flex: none;
}
.bv img {
  width: 100%;
  display: block;
}
.bv .acc {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  line-height: 1;
  pointer-events: none;
}
.acc.hat {
  top: -26%;
  font-size: calc(var(--w)*.42);
}
.acc.crown {
  top: -24%;
  font-size: calc(var(--w)*.38);
}
.acc.glasses {
  top: 24%;
  font-size: calc(var(--w)*.36);
}
.acc.bow {
  top: -6%;
  left: 70%;
  font-size: calc(var(--w)*.3);
}
.topbar {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--paper);
  border-bottom: 2px solid var(--line);
  z-index: 5;
}
.course {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--pc,#3BA7FF);
  box-shadow: 0 3px 0 rgba(0, 0, 0, .18);
  color: #fff;
  font-family: var(--f-display);
  font-weight: 900;
  font-size: 18px;
  position: relative;
  display: grid;
  place-items: center;
  flex: none;
}
.course .gb {
  position: absolute;
  right: -5px;
  bottom: -5px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  line-height: 1;
}
.stats {
  display: flex;
  gap: 6px;
  align-items: center;
  flex: 1;
  justify-content: space-around;
}
.stat {
  display: flex;
  align-items: center;
  gap: 4px;
  font-weight: 900;
  font-size: 16px;
  font-variant-numeric: tabular-nums;
}
.stat svg {
  width: 22px;
  height: 22px;
}
.stat.flame.off {
  color: var(--stone-deep);
}
.stat.flame.off svg {
  filter: grayscale(1);
  opacity: .5;
}
.stat.flame {
  color: var(--wood-deep);
}
.stat .emo {
  font-size: 20px;
  line-height: 1;
}
.stat.gem {
  color: var(--sky);
}
.stat.heart {
  color: var(--berry);
}
.stat.xp {
  color: var(--sun-deep);
}
.stat.bump {
  animation: bump .5s;
}
.boost {
  font-size: 12px;
  font-weight: 900;
  color: #fff;
  background: var(--grape);
  border-radius: 999px;
  padding: 2px 8px;
}
@keyframes bump {
  40% {
    transform: scale(1.35);
  }
}
.map {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  background: var(--paper);
}
.unitbar {
  position: -webkit-sticky;
  position: sticky;
  top: 0;
  z-index: 7;
  padding: 10px 12px;
  background: linear-gradient(var(--paper) 70%, transparent);
}
.unit {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #FFF6E6;
  border-radius: 12px;
  padding: 10px 10px 10px 20px;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, .05) 0 3px,
      transparent 3px 9px),
    linear-gradient(#C98F55, #A8713C);
  border: 3px solid var(--wood-deep);
  box-shadow: inset 9px 0 0 var(--uc,#3FAE49), 0 4px 0 #5E3A16;
  transition: box-shadow .4s;
  text-shadow: 0 1px 0 rgba(0, 0, 0, .25);
}
.unit .guide {
  color: #FFF6E6;
}
.unit .ut {
  flex: 1;
  min-width: 0;
}
.unit small {
  display: block;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 1px;
  opacity: .9;
  text-transform: uppercase;
}
.unit b {
  display: block;
  font-family: var(--f-display);
  font-weight: 900;
  font-size: 21px;
  line-height: 1.1;
}
.guide {
  align-self: stretch;
  display: grid;
  place-items: center;
  border-left: 2px solid rgba(0, 0, 0, .16);
  padding: 0 4px 0 14px;
  color: #fff;
}
.guide svg {
  width: 28px;
  height: 28px;
}
.jumpbtn {
  border: 2px solid rgba(255, 255, 255, .75);
  border-radius: 12px;
  padding: 8px 10px;
  font-weight: 900;
  font-size: 13px;
  color: #fff;
  white-space: nowrap;
  letter-spacing: .5px;
}
.journey {
  position: relative;
  display: flex;
  flex-direction: column;
}
.zone {
  position: relative;
  width: 100%;
  content-visibility: auto;
  contain-intrinsic-size: auto 600px;
}
.zbg {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  overflow: hidden;
}
.zbg img {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.zbg img.gr {
  filter: grayscale(1) brightness(1.06) contrast(.92);
  -webkit-mask-image:
    linear-gradient(
      to bottom,
      #000 calc(var(--cut,110%) - 7%),
      transparent var(--cut,110%));
  mask-image:
    linear-gradient(
      to bottom,
      #000 calc(var(--cut,110%) - 7%),
      transparent var(--cut,110%));
  transition: opacity .8s;
}
.zone.locked .zbg img {
  filter: grayscale(1) brightness(1.06) contrast(.92);
}
.hole {
  position: absolute;
  transform: translate(-50%, -50%);
  z-index: 1;
}
.hole.sg {
  width: 10.6%;
  aspect-ratio: 1.75;
  display: grid;
  place-items: center;
  border-radius: 8px;
  color: var(--dc);
}
.hole.sg svg {
  width: 38%;
  height: auto;
}
.hole.sg.future {
  color: #8E8C99;
}
.hole.sg.future svg {
  width: 34%;
}
.hole.sg .rwi {
  font-size: min(6vw, 24px);
  line-height: 1;
}
.hole.sg .st {
  top: auto;
  bottom: 6%;
  margin: 0;
  background: none;
  box-shadow: none;
  padding: 0;
}
.hole.sg .st svg {
  width: 9px;
  height: 9px;
}
.hole.sg:active {
  transform: translate(-50%, -50%) scale(.94);
}
.hole.current .cic {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  display: grid;
  place-items: center;
  color: var(--dc);
  font-size: 30px;
}
.hole.current .cic svg {
  width: 30px;
  height: 30px;
}
.hole .st {
  position: absolute;
  top: 100%;
  margin-top: 4px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 1px;
  background: rgba(255, 255, 255, .94);
  border-radius: 999px;
  padding: 1px 5px;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .15);
}
.hole .st svg {
  width: 11px;
  height: 11px;
}
.rewards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.rw {
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 10px 4px;
  text-align: center;
  font-size: 30px;
}
.rw.lock {
  filter: grayscale(1);
  opacity: .45;
}
.themes {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.theme {
  border: 2px solid var(--line);
  box-shadow: 0 4px 0 var(--line);
  border-radius: 16px;
  padding: 10px 2px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 30px;
}
.theme small {
  font-size: 12px;
  font-weight: 800;
  color: var(--ink-soft);
}
.theme[aria-pressed=true],
.chip[aria-pressed=true] {
  border-color: var(--sky);
  box-shadow: 0 4px 0 var(--sky);
  background: var(--sky-tint);
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  min-width: 48px;
  border: 2px solid var(--line);
  box-shadow: 0 4px 0 var(--line);
  border-radius: 14px;
  padding: 10px 12px;
  font-weight: 800;
  font-size: 17px;
}
.chip small {
  display: block;
  font-size: 11px;
  color: var(--ink-soft);
  font-weight: 700;
}
.chip.lockd {
  opacity: .7;
  cursor: default;
}
.ptitle {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 6px 0 4px;
}
.ptitle .pe {
  font-size: 44px;
}
.sample {
  margin-top: 10px;
  background: var(--mist);
  border-radius: 14px;
  padding: 10px 14px;
  font-weight: 800;
  color: var(--ink-soft);
}
.sample b {
  font-family: var(--f-display);
  font-size: 22px;
  color: var(--ink);
  font-weight: 600;
}
.pinpad {
  display: grid;
  grid-template-columns: repeat(3, 64px);
  gap: 10px;
  justify-content: center;
  margin: 10px 0;
}
.pinpad button {
  height: 56px;
  border-radius: 16px;
  border: 2px solid var(--line);
  box-shadow: 0 4px 0 var(--line);
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 26px;
}
.pindots {
  display: flex;
  gap: 10px;
  justify-content: center;
  min-height: 18px;
}
.pindots i {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--ink);
}
.shake {
  animation: shake .4s;
}
@keyframes shake {
  25% {
    transform: translateX(-8px);
  }
  50% {
    transform: translateX(8px);
  }
  75% {
    transform: translateX(-4px);
  }
}
.parentsbtn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.parentsbtn .pe {
  font-size: 22px;
}
.hole.current {
  width: 100px;
  height: 100px;
  border-radius: 50%;
}
.hole.current .ringsvg {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .25));
}
.hole.current.chest .cic {
  font-size: 40px;
  animation: wobble 1.2s ease-in-out infinite;
}
.micwrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 4px 0;
}
.microw {
  display: flex;
  gap: 14px;
  justify-content: center;
  align-items: stretch;
}
.micpill {
  width: 190px;
  height: 84px;
  border-radius: 22px;
  background: var(--sky);
  box-shadow: 0 7px 0 var(--sky-deep);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: background .2s;
}
.micpill i {
  width: 10px;
  height: 10px;
  border-radius: 5px;
  background: #fff;
  transition: height .15s;
}
.micpill.on {
  background: var(--sky);
}
.micpill.on i {
  animation: wv .55s ease-in-out infinite alternate;
}
.micpill.on i:nth-child(2n) {
  animation-delay: .15s;
}
.micpill.on i:nth-child(3n) {
  animation-delay: .3s;
}
.micpill.on i:nth-child(5n) {
  animation-delay: .42s;
}
.micpill.idle {
  background: #E5E5EA;
  box-shadow: 0 7px 0 #CFCFD6;
}
.micpill.idle i {
  background: #A9A9B3;
}
.micpill.off {
  background: #E5E5EA;
  box-shadow: 0 7px 0 #CFCFD6;
  color: #9A97AB;
}
.micpill.off svg {
  width: 34px;
  height: 34px;
}
@keyframes wv {
  from {
    height: 10px;
  }
  to {
    height: 34px;
  }
}
.refresh {
  width: 84px;
  border-radius: 22px;
  border: 2px solid var(--line);
  box-shadow: 0 5px 0 var(--line);
  display: grid;
  place-items: center;
  color: var(--sky);
}
.refresh svg {
  width: 38px;
  height: 38px;
}
#micMsg {
  min-height: 22px;
  max-width: 32ch;
  text-align: center;
  margin: 0;
}
.anslang {
  display: flex;
  gap: 6px;
  justify-content: center;
  align-items: center;
  font-weight: 800;
  font-size: 13px;
  color: var(--ink-soft);
}
.anslang button {
  border: 2px solid var(--line);
  border-radius: 999px;
  padding: 4px 12px;
  font-weight: 800;
  font-size: 14px;
  color: var(--ink-soft);
}
.anslang button[aria-pressed=true] {
  border-color: var(--sky);
  background: var(--sky-tint);
  color: var(--sky-deep);
}
.saidit {
  display: grid;
  gap: 10px;
}
.cardstack {
  position: relative;
  width: 250px;
  height: 250px;
  margin: 18px auto 8px;
}
.cardstack::before,
.cardstack::after {
  content: "";
  position: absolute;
  left: 14px;
  right: 14px;
  top: -10px;
  height: 40px;
  border: 2px solid var(--line);
  border-bottom: 0;
  border-radius: 24px 24px 0 0;
  background: #F7F7F9;
}
.cardstack::after {
  left: 28px;
  right: 28px;
  top: -19px;
  background: #FBFBFC;
}
.wcard {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 1;
  border: 2px solid var(--line);
  border-radius: 28px;
  background: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px;
  text-align: center;
}
.wcard .wpic {
  font-size: 30px;
  line-height: 1.15;
  max-width: 200px;
  word-break: break-all;
}
.wcard b {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 44px;
  line-height: 1;
  color: var(--ink);
}
.wcard small {
  font-weight: 700;
  font-size: 20px;
  color: var(--ink-soft);
}
.wcard.flip {
  animation: cardin .35s ease-out;
}
@keyframes cardin {
  from {
    transform: translateX(40px) rotate(6deg);
    opacity: 0;
  }
}
.repeat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
}
.repeat .rb {
  position: relative;
  border: 2px solid var(--line);
  border-radius: 18px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 22px;
  font-weight: 700;
  color: var(--sky-deep);
  background: #fff;
}
.repeat .rb::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -11px;
  width: 18px;
  height: 18px;
  background: #fff;
  border-right: 2px solid var(--line);
  border-bottom: 2px solid var(--line);
  transform: translateX(-50%) rotate(45deg);
}
.repeat .rb span {
  border-bottom: 2px dashed #9CC9F0;
  line-height: 1.35;
}
.repeat .rb button {
  color: var(--sky);
  flex: none;
}
.repeat .rb button svg {
  width: 30px;
  height: 30px;
}
.repeat .bvbig {
  margin-top: 8px;
}
#tapAlt {
  align-self: stretch;
}
.nomic {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-soft);
  text-align: center;
  margin: 0;
  max-width: 34ch;
}
.mt.expr {
  font-size: 24px;
}
.cant {
  align-self: center;
  font-weight: 800;
  color: #AFAFBA;
  text-transform: uppercase;
  letter-spacing: .8px;
  font-size: 15px;
  padding: 10px 12px;
  margin-top: 6px;
}
@keyframes ring {
  0% {
    transform: scale(.7);
    opacity: 1;
  }
  100% {
    transform: scale(1.25);
    opacity: 0;
  }
}
.tip {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--paper);
  color: var(--tc,var(--beaver));
  font-weight: 900;
  font-size: 14px;
  padding: 4px 12px;
  border-radius: 12px;
  border: 2px solid var(--line);
  white-space: nowrap;
  animation: float 1.6s ease-in-out infinite;
  letter-spacing: .8px;
}
.tip::after {
  content: "";
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%) rotate(45deg);
  width: 12px;
  height: 12px;
  background: var(--paper);
  border-right: 2px solid var(--line);
  border-bottom: 2px solid var(--line);
}
@keyframes float {
  50% {
    margin-bottom: 6px;
  }
}
.beaver {

  transform: scale(0);
  transition: transform .3s;
}
.reveal .item {
  font-size: 130px;
  transform: scale(0) rotate(-200deg);
  transition: transform .7s cubic-bezier(.3, 1.6, .5, 1);
}
.reveal .item.show {
  transform: scale(1) rotate(0);
}
.reveal h2 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 30px;
}
.reveal p {
  margin: 0;
  font-weight: 700;
  color: var(--ink-soft);
}
.reveal .btn {
  max-width: 300px;
}
.rays {
  position: absolute;
  width: 340px;
  height: 340px;
  border-radius: 50%;
  background: repeating-conic-gradient(#FFE9A8 0 12deg, transparent 12deg 30deg);
  animation: spin 8s linear infinite;
  opacity: 0;
  transition: opacity .5s;
  z-index: -1;
}
.reveal.lit .rays {
  opacity: .8;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes shakeg {
  25% {
    transform: rotate(-12deg);
  }
  75% {
    transform: rotate(12deg);
  }
}
.costrow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 6px 0;
}
.costrow .stp {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  border: 2px solid var(--line);
  font-weight: 900;
  font-size: 18px;
}
.costrow span {
  min-width: 64px;
  text-align: center;
  font-weight: 800;
}
.prset {
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 10px 12px;
  margin-bottom: 10px;
}
.prset .pt {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
}
.prset .pt .e {
  font-size: 28px;
}
.prset .est {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-soft);
  margin: 4px 0 0;
}
.pop.up {
  transform-origin: var(--ax) 100%;
}
.pop.up::before {
  top: auto;
  bottom: -8px;
}
.months {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

@font-face {

@font-face {

@font-face {
  font-family: "Nunito";

:root {
  --q-ink:#26334D;
  --q-soft:#6B7890;
  --q-card:#FFFFFF;
  --q-sun:#FFC93C;
  --q-sun-d:#E7A400;
  --q-mint:#3DBE86;
  --q-mint-d:#2A9A6A;
  --q-mint-t:#E2F7EC;
  --q-sky:#4E9BEA;
  --q-sky-d:#3878C4;
  --q-sky-t:#E6F1FF;
  --q-coral:#FF8C82;
  --q-coral-t:#FFF0EE;
  --q-lilac:#8E7CF0;
}
.lesson.q2 {
  background:
    linear-gradient(
      180deg,
      #E6F3FF 0%,
      #F4F8FF 38%,
      #FFF7EC 100%);
  color: var(--q-ink);
}
.lesson.q2 .lhead {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px 4px;
}
.lesson.q2 .lclose {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #fff;
  color: var(--q-soft);
  border: 0;
  box-shadow: 0 3px 10px rgba(38, 51, 77, .10);
  display: grid;
  place-items: center;
  flex: none;
}
.lesson.q2 .lclose svg {
  width: 18px;
  height: 18px;
}
.qdots {
  flex: 1;
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
}
.qdots i {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  box-shadow: inset 0 0 0 2.5px #D5DEEC;
  transition: .3s;
}
.qdots i.on {
  background: var(--q-mint);
  box-shadow: 0 0 0 3px #C9F0DD;
  transform: scale(1.1);
}
.qbody {
  flex: 1;
  overflow-y: auto;
  padding: 6px 18px 120px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 18px;
}
.qbody.in > * {
  animation: qin .45s cubic-bezier(.3, 1.4, .5, 1) both;
}
.qbody.in > *:nth-child(2) {
  animation-delay: .06s;
}
.qbody.in > *:nth-child(3) {
  animation-delay: .12s;
}
@keyframes qin {
  from {
    opacity: 0;
    transform: translateY(16px) scale(.97);
  }
}
.qtop {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
  min-height: 76px;
}
.qspk {
  position: relative;
  width: 76px;
  height: 76px;
  border-radius: 50%;
  border: 0;
  flex: none;
  color: #5A3B00;
  background:
    radial-gradient(
      circle at 35% 30%,
      #FFE58A,
      var(--q-sun) 60%);
  box-shadow: 0 6px 0 var(--q-sun-d), 0 10px 22px rgba(231, 164, 0, .35);
  display: grid;
  place-items: center;
}
.qspk svg {
  width: 38px;
  height: 38px;
}
.qspk:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 var(--q-sun-d);
}
.qspk::after {
  content: "";
  position: absolute;
  top: -8px;
  right: -8px;
  bottom: -8px;
  left: -8px;
  border-radius: 50%;
  border: 4px solid var(--q-sun);
  opacity: 0;
}
.qspk.talking::after {
  animation: ring 1.2s ease-out infinite;
}
@keyframes ring {
  from {
    opacity: .9;
    transform: scale(.92);
  }
  to {
    opacity: 0;
    transform: scale(1.35);
  }
}
.qtop .cap {
  font-weight: 800;
  font-size: 15px;
  color: var(--q-soft);
  max-width: 220px;
  line-height: 1.3;
}
.qvis {
  background: var(--q-card);
  border-radius: 28px;
  box-shadow: 0 10px 28px rgba(38, 51, 77, .08);
  padding: 20px 14px;
  min-height: 200px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  position: relative;
}
.qvis .clk {
  width: 170px;
  height: 170px;
}
.qvis .clk.hintclk line:last-of-type {
  stroke: #FF8C82;
  filter: drop-shadow(0 0 4px #FF8C82);
}
.bignum {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 96px;
  line-height: 1;
  color: var(--q-lilac);
  text-shadow: 0 5px 0 #E4DEFF;
}
.bignum.sm {
  font-size: 72px;
}
.bignum.q {
  color: #C3CCDB;
  text-shadow: 0 5px 0 #EEF2F8;
}
.seq {
  display: flex;
  align-items: center;
  gap: 14px;
}
.seq .arr {
  font-size: 34px;
  color: #B9C3D3;
}
.bigemo {
  font-size: 88px;
  line-height: 1;
}
.bigemo.soft {
  opacity: .85;
  font-size: 64px;
}
.listen {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background:
    linear-gradient(
      160deg,
      #F1ECFF,
      #E6F1FF);
  display: grid;
  place-items: center;
  font-size: 66px;
  box-shadow: inset 0 -6px 0 rgba(142, 124, 240, .12);
}
.listen.radio {
  background:
    linear-gradient(
      160deg,
      #FFF0E6,
      #FFF7D6);
}
.domisays {
  display: flex;
  align-items: flex-end;
  gap: 6px;
}
.domisays .bub {
  background: var(--q-sky-t);
  border-radius: 24px 24px 24px 6px;
  padding: 14px 18px;
  font-family: var(--f-display);
  font-size: 34px;
  color: var(--q-ink);
}
.domisays.big .pe {
  font-size: 84px;
  line-height: 1;
  display: block;
}
.grp {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 4px;
  justify-content: center;
  max-width: 220px;
}
.grp .ob {
  font-style: normal;
  font-size: 30px;
  line-height: 1.1;
  position: relative;
  transition: transform .2s;
}
.qvis .grp .ob {
  font-size: 38px;
}
.ob.gone {
  opacity: .25;
  filter: grayscale(1);
  transform: translateY(-6px) rotate(-12deg);
}
.ob.counted {
  transform: scale(1.15);
}
.ob.counted::after {
  content: attr(data-n);
  position: absolute;
  top: -10px;
  right: -8px;
  min-width: 20px;
  height: 20px;
  border-radius: 10px;
  background: var(--q-sky);
  color: #fff;
  font: 700 12px/20px var(--f-display);
  text-align: center;
  font-style: normal;
  box-shadow: 0 2px 0 var(--q-sky-d);
}
.ob.dot {
  font-size: 14px;
  color: var(--q-lilac);
}
.story2 {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
.story2 .op {
  font-family: var(--f-display);
  font-size: 40px;
  color: var(--q-sun-d);
}
.story2 .gift {
  font-family: var(--f-display);
  font-size: 26px;
  background: var(--q-coral-t);
  border-radius: 16px;
  padding: 4px 10px;
  color: #C2554B;
}
.qvis .eq {
  display: flex;
  flex-direction: row;
  background: none;
  padding: 0;
  border: 0;
  box-shadow: none;
  width: auto;
  align-items: flex-start;
  gap: 10px;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 64px;
  line-height: 1;
}
.qvis .eq > span {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.qvis .eq > b {
  color: var(--q-sun-d);
  font-weight: 700;
}
.qvis .eq .q {
  color: #C3CCDB;
}
.dots {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--q-lilac);
  max-width: 70px;
  line-height: 1.2;
  text-align: center;
  word-break: break-all;
  font-family: system-ui;
}
.coinname {
  font-family: var(--f-display);
  font-size: 24px;
  color: var(--q-soft);
}
.ctag {
  font: 700 14px var(--f-display);
  background: var(--q-sun);
  color: #5A3B00;
  border-radius: 999px;
  padding: 1px 8px;
  margin: -8px 2px 0;
}
.nline {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}
.nline span {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: #F2F5FA;
  display: grid;
  place-items: center;
  font: 700 17px var(--f-display);
  color: var(--q-soft);
}
.nline span.hi {
  background: var(--q-sky);
  color: #fff;
}
.qopts {
  display: grid;
  gap: 12px;
}
.qopts.row3 {
  grid-template-columns: repeat(3, 1fr);
}
.qopts.row,
.qopts.yn {
  grid-template-columns: 1fr 1fr;
}
.qopts.grid {
  grid-template-columns: 1fr 1fr;
}
.qopts.col {
  grid-template-columns: 1fr;
}
.qo {
  --bg:#fff;
  --bd:#E2E8F2;
  --sh:#C9D3E3;
  --ink:var(--q-ink);
  position: relative;
  border: 3px solid var(--bd);
  background: var(--bg);
  color: var(--ink);
  border-radius: 24px;
  box-shadow: 0 6px 0 var(--sh);
  min-height: 108px;
  padding: 10px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition:
    transform .12s,
    box-shadow .12s,
    opacity .3s,
    filter .3s;
  font-family: var(--f-display);
}
.qo:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 var(--sh);
}
.qo.t0 {
  --bg:#F3EFFF;
  --bd:#CFC2FF;
  --sh:#A898F5;
  --ink:#4B3A99;
}
.qo.t1 {
  --bg:#E8F9F1;
  --bd:#A6E6C9;
  --sh:#5BC796;
  --ink:#1E6B4D;
}
.qo.t2 {
  --bg:#FFF2E9;
  --bd:#FFCDB0;
  --sh:#F3A274;
  --ink:#8A4423;
}
.qo.t3 {
  --bg:#EAF4FF;
  --bd:#B3D5FF;
  --sh:#6EA8EC;
  --ink:#23528F;
}
.qo .num {
  font-size: 46px;
  line-height: 1;
  font-weight: 700;
}
.qo .num.t {
  font-size: 30px;
}
.qo .yn {
  font-size: 52px;
  line-height: 1;
}
.qo .oe {
  font-size: 44px;
  line-height: 1;
}
.qo small {
  font: 700 14px var(--f-body,inherit);
  opacity: .85;
}
.qo .grp .ob {
  font-size: 26px;
}
.qopts.col .qo {
  min-height: 72px;
  flex-direction: row;
}
.qo.right {
  --bg:var(--q-mint-t);
  --bd:var(--q-mint);
  --sh:var(--q-mint-d);
  animation: pop .4s;
}
.qo.right::after,
.qo.show::after {
  content: "\2713";
  position: absolute;
  top: -10px;
  right: -8px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--q-mint);
  color: #fff;
  font: 700 18px/30px var(--f-display);
  text-align: center;
  box-shadow: 0 3px 0 var(--q-mint-d);
}
.qo.show {
  --bg:var(--q-mint-t);
  --bd:var(--q-mint);
  --sh:var(--q-mint-d);
  animation: glowq 1.2s ease-in-out infinite;
}
.qo.wrong {
  --bd:var(--q-coral);
  animation: shake .4s;
}
.qo.faded {
  opacity: .35;
  filter: grayscale(.6);
  pointer-events: none;
}
@keyframes pop {
  50% {
    transform: scale(1.08);
  }
}
@keyframes glowq {
  50% {
    box-shadow: 0 6px 0 var(--q-mint-d), 0 0 0 8px rgba(61, 190, 134, .25);
  }
}
@keyframes shake {
  20%, 60% {
    transform: translateX(-7px);
  }
  40%, 80% {
    transform: translateX(7px);
  }
}
.qhint {
  position: absolute;
  left: 50%;
  top: 76px;
  transform: translateX(-50%);
  z-index: 30;
  background: #fff;
  color: var(--q-ink);
  font-weight: 800;
  border-radius: 999px;
  padding: 10px 18px;
  box-shadow: 0 8px 24px rgba(38, 51, 77, .18);
  white-space: nowrap;
  animation: qin .35s both;
}
.qsheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 25;
  padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  border-radius: 28px 28px 0 0;
  transform: translateY(110%);
  transition: transform .35s cubic-bezier(.3, 1.3, .5, 1);
  box-shadow: 0 -8px 30px rgba(38, 51, 77, .12);
}
.qsheet.show {
  transform: none;
}
.qsheet.good {
  background: #E3F8EE;
}
.qsheet.learn {
  background: #E8F2FF;
}
.qsrow {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.qsrow .qsf {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: #fff;
  display: grid;
  place-items: center;
  flex: none;
  overflow: hidden;
}
.qsrow b {
  display: block;
  font-family: var(--f-display);
  font-size: 26px;
  line-height: 1.1;
}
.qsheet.good b {
  color: #1F8A5B;
}
.qsheet.learn b {
  color: #2D62B5;
}
.qsrow span span {
  display: block;
  font-weight: 800;
  font-size: 17px;
  color: var(--q-ink);
  margin-top: 3px;
  line-height: 1.35;
}
.qbtn {
  width: 100%;
  border: 0;
  border-radius: 20px;
  min-height: 56px;
  font: 700 20px var(--f-display);
  color: #fff;
  letter-spacing: .3px;
  transition: transform .1s, box-shadow .1s;
}
.qbtn:active {
  transform: translateY(4px);
}
.qbtn.good {
  background: var(--q-mint);
  box-shadow: 0 5px 0 var(--q-mint-d);
}
.qbtn.learn,
.qbtn.sky {
  background: var(--q-sky);
  box-shadow: 0 5px 0 var(--q-sky-d);
}
.qbtn:disabled {
  background: #D7DEE9;
  box-shadow: 0 5px 0 #BCC6D6;
}
.qbtn.big {
  min-height: 62px;
  font-size: 22px;
}
.qbtn.pulse {
  animation: pop 1s ease-in-out infinite;
}
.radio {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding-top: 10px;
}
.rbox {
  position: relative;
  width: 170px;
  height: 170px;
  border-radius: 40px;
  background:
    linear-gradient(
      160deg,
      #FFE7D1,
      #FFD3B0);
  display: grid;
  place-items: center;
  box-shadow: 0 8px 0 #F3A274, 0 16px 30px rgba(243, 162, 116, .35);
}
.rbox .remo {
  font-size: 96px;
}
.rbox .rwave {
  position: absolute;
  top: -12px;
  right: -12px;
  bottom: -12px;
  left: -12px;
  border-radius: 50px;
  border: 5px solid #FFB98A;
  opacity: 0;
}
.rbox.on .rwave {
  animation: wavec 1.4s ease-out infinite;
}
.rbox.on .r2 {
  animation-delay: .7s;
}
@keyframes wavec {
  from {
    transform: scale(.9);
    opacity: .9;
  }
  to {
    transform: scale(1.3);
    opacity: 0;
  }
}
.rtitle {
  font-family: var(--f-display);
  font-size: 28px;
  color: var(--q-ink);
}
.rbtns {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 12px;
  width: 100%;
  max-width: 340px;
}
.dance {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 28;
  display: grid;
  place-items: center;
  pointer-events: none;
}
.dance .bv {
  animation: dancea .45s ease-in-out 4 alternate;
}
.dance .tx {
  position: absolute;
  bottom: 30%;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 32px;
  color: #F29A00;
  text-shadow: 0 3px 0 #fff;
}
@keyframes dancea {
  from {
    transform: rotate(-12deg) translateY(0);
  }
  to {
    transform: rotate(12deg) translateY(-24px);
  }
}
.qresult {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 40;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 24px;
  text-align: center;
  background:
    linear-gradient(
      180deg,
      #FFF6DA,
      #FFE9F1 60%,
      #E9F1FF);
  overflow: hidden;
}
.qresult .rs-sun {
  position: absolute;
  top: 8%;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  background: repeating-conic-gradient(rgba(255, 201, 60, .35) 0 10deg, transparent 10deg 24deg);
  animation: spin 14s linear infinite;
}
.qresult .dm {
  position: relative;
  animation: dancea .5s ease-in-out 6 alternate;
}
.qresult h2 {
  position: relative;
  margin: 0;
  font-family: var(--f-display);
  font-size: 38px;
  color: #F29A00;
  text-shadow: 0 3px 0 #fff;
}
.qresult p {
  position: relative;
  margin: 0;
  font-weight: 800;
  font-size: 18px;
  color: var(--q-soft);
}
.gains {
  position: relative;
  display: flex;
  gap: 10px;
  margin: 6px 0 10px;
}
.gn {
  font-family: var(--f-display);
  font-size: 28px;
  background: #fff;
