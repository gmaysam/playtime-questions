<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Paraxilingo B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: one iPhone-sized screen in the full Duolingo shell — Learn (sticky unit banner + picture map), Leagues, Quests, Shop, Profile. Lessons, stories, result screens, guidebook and pop-up cards slide over it. */
:root{
  --ink:#3B2A1E;--ink-soft:#7A6552;--paper:#FFFFFF;--mist:#F6EEDF;--line:#EADCC4;
  --beaver:#D9772E;--beaver-deep:#9E5320;--beaver-tint:#FBEBDB;
  --leaf:#6BA539;--leaf-deep:#4A7A22;--leaf-tint:#EAF3DA;
  --berry:#D4593A;--berry-deep:#A23E22;--berry-tint:#FBE6DE;
  --sun:#F2B533;--sun-deep:#BD8516;--sun-tint:#FCF1D3;
  --sky:#3C8EC0;--sky-deep:#276A93;--sky-tint:#E1EFF7;
  --wood:#B87B42;--wood-deep:#7A4A1E;
  --grape:#A05CF0;--grape-deep:#7B3BCB;--grape-tint:#F1E6FF;
  --stone:#C8C6D3;--stone-deep:#9A97AB;--desk:#1E2A44;
  --f-display:"Fredoka","M PLUS Rounded 1c",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"M PLUS Rounded 1c",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.stage{height:100%;display:grid;place-items:center;grid-template-rows:100%;grid-template-columns:100%}
.phone{position:relative;width:100%;height:100%;min-height:0;max-height:100%;background:var(--paper);overflow:hidden;overflow:clip;display:flex;flex-direction:column}
.island,.statusbar{display:none}
@media (min-width:560px) and (min-height:720px){
  .stage{background:radial-gradient(1200px 600px at 70% 10%,#2F4775 0%,transparent 60%),var(--desk)}
  .stage{grid-template-columns:auto}
  .phone{width:390px;height:min(844px,calc(100% - 40px));border-radius:56px;border:11px solid #0E0E14;box-shadow:0 0 0 2px #3A3A48,0 40px 80px rgba(0,0,0,.45)}
  .island{display:block;position:absolute;top:10px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#0E0E14;z-index:90}
  .statusbar{display:flex;justify-content:space-between;align-items:center;height:46px;padding:0 30px;font-weight:900;font-size:15px;background:var(--paper);flex:none}
  .statusbar .sig{display:flex;gap:5px;align-items:center}
  .over{top:46px!important}
}

/* Domi with his outfit */
.bv{position:relative;display:inline-block;line-height:0;flex:none}
.bv img{width:100%;display:block}
.bv .acc{position:absolute;left:50%;transform:translateX(-50%);line-height:1;pointer-events:none}
.acc.hat{top:-26%;font-size:calc(var(--w)*.42)}
.acc.crown{top:-24%;font-size:calc(var(--w)*.38)}
.acc.glasses{top:24%;font-size:calc(var(--w)*.36)}
.acc.bow{top:-6%;left:70%;font-size:calc(var(--w)*.3)}

/* ---------- top bar ---------- */
.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--paper);border-bottom:2px solid var(--line);z-index:5}
.course{width:40px;height:40px;border-radius:50%;background:var(--pc,#3BA7FF);box-shadow:0 3px 0 rgba(0,0,0,.18);color:#fff;font-family:var(--f-display);font-weight:900;font-size:18px;position:relative;display:grid;place-items:center;flex:none}
.course .gb{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;line-height:1}
.stats{display:flex;gap:6px;align-items:center;flex:1;justify-content:space-around}
.stat{display:flex;align-items:center;gap:4px;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.stat svg{width:22px;height:22px}
.stat.flame.off{color:var(--stone-deep)}
.stat.flame.off svg{filter:grayscale(1);opacity:.5}
.stat.flame{color:var(--wood-deep)}.stat .emo{font-size:20px;line-height:1}.stat.gem{color:var(--sky)}.stat.heart{color:var(--berry)}.stat.xp{color:var(--sun-deep)}
.stat.bump{animation:bump .5s}
.boost{font-size:12px;font-weight:900;color:#fff;background:var(--grape);border-radius:999px;padding:2px 8px}
@keyframes bump{40%{transform:scale(1.35)}}

/* ---------- learn: picture map ---------- */
.map{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;background:var(--paper)}
.unitbar{position:sticky;top:0;z-index:7;padding:10px 12px;background:linear-gradient(var(--paper) 70%,transparent)}
.unit{display:flex;align-items:center;gap:10px;color:#FFF6E6;border-radius:12px;padding:10px 10px 10px 20px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 3px,transparent 3px 9px),linear-gradient(#C98F55,#A8713C);border:3px solid var(--wood-deep);box-shadow:inset 9px 0 0 var(--uc,#3FAE49),0 4px 0 #5E3A16;transition:box-shadow .4s;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.unit .guide{color:#FFF6E6}
.unit .ut{flex:1;min-width:0}
.unit small{display:block;font-size:12px;font-weight:900;letter-spacing:1px;opacity:.9;text-transform:uppercase}
.unit b{display:block;font-family:var(--f-display);font-weight:900;font-size:21px;line-height:1.1}
.guide{align-self:stretch;display:grid;place-items:center;border-left:2px solid rgba(0,0,0,.16);padding:0 4px 0 14px;color:#fff}
.guide svg{width:28px;height:28px}
.jumpbtn{border:2px solid rgba(255,255,255,.75);border-radius:12px;padding:8px 10px;font-weight:900;font-size:13px;color:#fff;white-space:nowrap;letter-spacing:.5px}
.journey{position:relative;display:flex;flex-direction:column}
.zone{position:relative;width:100%;content-visibility:auto;contain-intrinsic-size:auto 600px}
.zbg{position:absolute;inset:0;overflow:hidden}
.zbg img{position:absolute;inset:0;width:100%;height:100%;display:block}
/* the grey copy covers everything Domi has not reached yet, fading into colour just above him */
.zbg img.gr{filter:grayscale(1) brightness(1.06) contrast(.92);-webkit-mask-image:linear-gradient(to bottom,#000 calc(var(--cut,110%) - 7%),transparent var(--cut,110%));mask-image:linear-gradient(to bottom,#000 calc(var(--cut,110%) - 7%),transparent var(--cut,110%));transition:opacity .8s}
.zone.locked .zbg img{filter:grayscale(1) brightness(1.06) contrast(.92)}

.hole{position:absolute;transform:translate(-50%,-50%);z-index:1}
.hole.sg{width:10.6%;aspect-ratio:1.75;display:grid;place-items:center;border-radius:8px;color:var(--dc)}
.hole.sg svg{width:38%;height:auto}
.hole.sg.future{color:#8E8C99}
.hole.sg.future svg{width:34%}
.hole.sg .rwi{font-size:min(6vw,24px);line-height:1}
.hole.sg .st{top:auto;bottom:6%;margin:0;background:none;box-shadow:none;padding:0}
.hole.sg .st svg{width:9px;height:9px}
.hole.sg:active{transform:translate(-50%,-50%) scale(.94)}
.hole.current .cic{position:absolute;inset:0;display:grid;place-items:center;color:var(--dc);font-size:30px}
.hole.current .cic svg{width:30px;height:30px}
.hole .st{position:absolute;top:100%;margin-top:4px;left:50%;transform:translateX(-50%);display:flex;gap:1px;background:rgba(255,255,255,.94);border-radius:999px;padding:1px 5px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.hole .st svg{width:11px;height:11px}
.rewards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rw{border:2px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center;font-size:30px}
.rw.lock{filter:grayscale(1);opacity:.45}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.theme{border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:16px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:30px}
.theme small{font-size:12px;font-weight:800;color:var(--ink-soft)}
.theme[aria-pressed="true"],.chip[aria-pressed="true"]{border-color:var(--sky);box-shadow:0 4px 0 var(--sky);background:var(--sky-tint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:48px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:14px;padding:10px 12px;font-weight:800;font-size:17px}
.chip small{display:block;font-size:11px;color:var(--ink-soft);font-weight:700}
.chip.lockd{opacity:.7;cursor:default}
.ptitle{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.ptitle .pe{font-size:44px}
.sample{margin-top:10px;background:var(--mist);border-radius:14px;padding:10px 14px;font-weight:800;color:var(--ink-soft)}
.sample b{font-family:var(--f-display);font-size:22px;color:var(--ink);font-weight:600}
.pinpad{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center;margin:10px 0}
.pinpad button{height:56px;border-radius:16px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--f-display);font-weight:600;font-size:26px}
.pindots{display:flex;gap:10px;justify-content:center;min-height:18px}
.pindots i{width:14px;height:14px;border-radius:50%;background:var(--ink)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.parentsbtn{display:flex;align-items:center;justify-content:center;gap:8px}
.parentsbtn .pe{font-size:22px}
.hole.current{width:100px;height:100px;border-radius:50%}
.hole.current .ringsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.hole.current.chest .cic{font-size:40px;animation:wobble 1.2s ease-in-out infinite}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px 0}
.microw{display:flex;gap:14px;justify-content:center;align-items:stretch}
.micpill{width:190px;height:84px;border-radius:22px;background:var(--sky);box-shadow:0 7px 0 var(--sky-deep);color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .2s}
.micpill i{width:10px;height:10px;border-radius:5px;background:#fff;transition:height .15s}
.micpill.on{background:var(--sky)}
.micpill.on i{animation:wv .55s ease-in-out infinite alternate}
.micpill.on i:nth-child(2n){animation-delay:.15s}.micpill.on i:nth-child(3n){animation-delay:.3s}.micpill.on i:nth-child(5n){animation-delay:.42s}
.micpill.idle{background:#E5E5EA;box-shadow:0 7px 0 #CFCFD6}
.micpill.idle i{background:#A9A9B3}
.micpill.off{background:#E5E5EA;box-shadow:0 7px 0 #CFCFD6;color:#9A97AB}
.micpill.off svg{width:34px;height:34px}
@keyframes wv{from{height:10px}to{height:34px}}
.refresh{width:84px;border-radius:22px;border:2px solid var(--line);box-shadow:0 5px 0 var(--line);display:grid;place-items:center;color:var(--sky)}
.refresh svg{width:38px;height:38px}
#micMsg{min-height:22px;max-width:32ch;text-align:center;margin:0}
.anslang{display:flex;gap:6px;justify-content:center;align-items:center;font-weight:800;font-size:13px;color:var(--ink-soft)}
.anslang button{border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px;color:var(--ink-soft)}
.anslang button[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-tint);color:var(--sky-deep)}
.saidit{display:grid;gap:10px}
.cardstack{position:relative;width:250px;height:250px;margin:18px auto 8px}
.cardstack::before,.cardstack::after{content:"";position:absolute;left:14px;right:14px;top:-10px;height:40px;border:2px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;background:#F7F7F9}
.cardstack::after{left:28px;right:28px;top:-19px;background:#FBFBFC}
.wcard{position:absolute;inset:0;z-index:1;border:2px solid var(--line);border-radius:28px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;text-align:center}
.wcard .wpic{font-size:30px;line-height:1.15;max-width:200px;word-break:break-all}
.wcard b{font-family:var(--f-display);font-weight:600;font-size:44px;line-height:1;color:var(--ink)}
.wcard small{font-weight:700;font-size:20px;color:var(--ink-soft)}
.wcard.flip{animation:cardin .35s ease-out}
@keyframes cardin{from{transform:translateX(40px) rotate(6deg);opacity:0}}
.repeat{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:10px}
.repeat .rb{position:relative;border:2px solid var(--line);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;color:var(--sky-deep);background:#fff}
.repeat .rb::after{content:"";position:absolute;left:50%;bottom:-11px;width:18px;height:18px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.repeat .rb span{border-bottom:2px dashed #9CC9F0;line-height:1.35}
.repeat .rb button{color:var(--sky);flex:none}.repeat .rb button svg{width:30px;height:30px}
.repeat .bvbig{margin-top:8px}
#tapAlt{align-self:stretch}
.nomic{font-size:13px;font-weight:700;color:var(--ink-soft);text-align:center;margin:0;max-width:34ch}
.mt.expr{font-size:24px}
.cant{align-self:center;font-weight:800;color:#AFAFBA;text-transform:uppercase;letter-spacing:.8px;font-size:15px;padding:10px 12px;margin-top:6px}
@keyframes ring{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.25);opacity:0}}
.tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--paper);color:var(--tc,var(--beaver));font-weight:900;font-size:14px;padding:4px 12px;border-radius:12px;border:2px solid var(--line);white-space:nowrap;animation:float 1.6s ease-in-out infinite;letter-spacing:.8px}
.tip::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:var(--paper);border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
@keyframes float{50%{margin-bottom:6px}}

.beaver{position:absolute;width:64px;height:58px;overflow:visible;z-index:4;cursor:pointer;transition:left 1.1s cubic-bezier(.45,.05,.4,1),top 1.1s cubic-bezier(.45,.05,.4,1)}
.beaver .bv{margin-top:0;animation:peek 2.6s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.beaver.popin .bv{animation:popin .55s cubic-bezier(.3,1.6,.5,1) both}
.beaver.walking{overflow:visible}
.beaver.walking .bv{animation:hop .28s ease-in-out infinite alternate}
.beaver.flip .bv{scale:-1 1}
.beaver.away{display:none}
@keyframes peek{0%,100%{transform:translateY(3px)}50%{transform:translateY(-3px) rotate(-3deg)}}
@keyframes popin{from{transform:translateY(72px)}to{transform:translateY(0)}}
@keyframes hop{from{transform:translateY(-10px) rotate(-6deg)}to{transform:translateY(-26px) rotate(6deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px) rotate(-2deg)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg) scale(1.08)}75%{transform:rotate(10deg) scale(1.08)}}

.pop{position:absolute;z-index:6;width:270px;border-radius:20px;padding:14px 16px 16px;color:#fff;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);transform-origin:var(--ax) 0;animation:popcard .25s cubic-bezier(.3,1.5,.5,1);background:var(--pc)}
.pop::before{content:"";position:absolute;top:-8px;left:var(--ax);width:18px;height:18px;margin-left:-9px;background:inherit;transform:rotate(45deg);border-radius:3px}
.pop h4{margin:0;font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1.1}
.pop p{margin:0;font-weight:800;opacity:.92;font-size:14px}
.pop .pstars{display:flex;gap:2px}.pop .pstars svg{width:18px;height:18px}
.pop .btn{background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);color:var(--pc);margin-top:4px}
@keyframes popcard{from{transform:scale(.6);opacity:0}}

.jump{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:84px;z-index:6;width:54px;height:54px;border-radius:50%;background:var(--paper);box-shadow:0 5px 0 var(--line),0 6px 18px rgba(0,0,0,.18);display:grid;place-items:center;overflow:hidden}
.intro{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:130px;z-index:8;display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:22px;padding:10px 16px 10px 10px;border:2px solid var(--line);box-shadow:0 6px 0 var(--line),0 10px 24px rgba(0,0,0,.18);transform:translateX(-120%);transition:transform .45s cubic-bezier(.3,1.4,.5,1);cursor:pointer}
@media (min-width:560px) and (min-height:720px){.intro{top:176px}}
.intro.show{transform:none}
.intro .it{flex:1;min-width:0}
.intro .ik{font-size:12px;font-weight:900;color:var(--ink-soft);letter-spacing:1px;text-transform:uppercase}
.intro .in{font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1.1}
.intro .io{font-size:34px}

/* ---------- tab bar ---------- */
.tabbar{flex:none;display:flex;justify-content:space-around;background:var(--paper);border-top:2px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:5}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:70px;height:54px;border-radius:14px;border:2px solid transparent;color:var(--ink-soft)}
.tab small{font-size:11px;font-weight:800;letter-spacing:.2px}
.tab svg{width:30px;height:30px}
.tab .te{font-size:28px;line-height:1;filter:grayscale(.3)}
.tab[aria-selected="true"]{background:var(--sky-tint);border-color:#A9D6FF;color:var(--sky-deep)}
.tab[aria-selected="true"] .te{filter:none}
.tab .dot{position:absolute;top:2px;right:6px;width:12px;height:12px;border-radius:50%;background:var(--berry);border:2px solid var(--paper)}

/* ---------- panels ---------- */
.panel{flex:1;min-height:0;background:var(--paper);overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.panel h2{font-family:var(--f-display);font-weight:900;font-size:28px;margin:0;line-height:1.15}
.panel h3{font-family:var(--f-display);font-weight:900;font-size:20px;margin:22px 0 10px}
.panel p.sub{margin:2px 0 14px;color:var(--ink-soft);font-weight:700}
.hero{display:flex;align-items:center;gap:14px;color:#fff;border-radius:22px;padding:14px 16px;margin-bottom:6px;background:var(--grape)}
.hero b{display:block;font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1.1}
.hero span.s{font-weight:700;opacity:.92;font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:2px solid var(--line)}
.row:last-child{border-bottom:0}
.qi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none}
.qb{flex:1;min-width:0}
.qb b{display:block;font-weight:900;font-size:16px;margin-bottom:6px}
.qb small{display:block;color:var(--ink-soft);font-weight:700;margin:-4px 0 6px}
.pbar{position:relative;height:18px;border-radius:999px;background:var(--line);overflow:hidden}
.pbar i{position:absolute;inset:0 auto 0 0;background:var(--sun);border-radius:999px;box-shadow:inset 0 4px 0 rgba(255,255,255,.35);transition:width .8s cubic-bezier(.3,1.2,.5,1)}
.pbar span{position:relative;display:block;text-align:center;font-size:12px;font-weight:900;line-height:18px;color:var(--ink-soft)}
.chestbtn{width:46px;height:46px;font-size:32px;line-height:1;flex:none;display:grid;place-items:center;border-radius:14px}
.chestbtn.ready{animation:wobble 1.2s ease-in-out infinite;background:var(--sun-tint)}
.chestbtn.claimed{opacity:.35;filter:grayscale(1)}
.chestbtn:disabled:not(.claimed){opacity:.45;filter:grayscale(.7);cursor:default}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;border:2px solid var(--line);border-radius:20px;padding:12px 10px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:900;color:var(--ink-soft)}
.week .d{width:34px;height:34px;border-radius:50%;background:var(--mist);display:grid;place-items:center;font-size:18px}

.monthly{display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-radius:20px;padding:14px}

.tiers{display:flex;gap:6px;justify-content:center;margin:6px 0 4px;overflow:hidden}

.tierb.past{opacity:.8;filter:none}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:14px}

.lrow .rk.top{color:var(--leaf-deep)}
.lrow .av{width:42px;height:42px;border-radius:50%;background:var(--mist);display:grid;place-items:center;font-size:24px;flex:none;overflow:hidden}
.lrow .nm{flex:1;min-width:0;font-weight:900}
.lrow .px{font-weight:900;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.lrow.me{background:var(--sky-tint)}
.zoneline{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;letter-spacing:1px;margin:6px 0}
.zoneline::before,.zoneline::after{content:"";flex:1;height:2px;background:currentColor;opacity:.35}
.zoneline.up{color:var(--leaf-deep)}.zoneline.down{color:var(--berry-deep)}

.shopgrid{display:grid;gap:0}
.item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:2px solid var(--line)}

.price{display:flex;align-items:center;gap:4px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:14px;padding:8px 12px;font-weight:900;color:var(--sky-deep);white-space:nowrap}

.prof{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:2px solid var(--line)}
.avatar{width:88px;height:88px;border-radius:50%;background:var(--sky-tint);border:3px solid #A9D6FF;display:grid;place-items:end center;overflow:hidden;flex:none;padding-top:18px}

.gear{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;color:var(--ink-soft)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statc{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}

.badge .bi{width:58px;height:62px;border-radius:14px;display:grid;place-items:center;font-size:30px;flex:none;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.badge.lock .bi{filter:grayscale(1);opacity:.45}
.stickers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sticker{border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:8px 2px;text-align:center;min-width:0}
.sticker .big{font-size:30px;line-height:1.2}
.sticker .nm{font-size:10px;font-weight:900;line-height:1.2}
.sticker.lock .big{filter:grayscale(1) blur(2px);opacity:.3}
.sticker.lock .nm{color:var(--stone-deep)}
.back{display:flex;align-items:center;gap:6px;font-weight:900;color:var(--ink-soft);margin-bottom:10px}
.back svg{width:22px;height:22px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;font-weight:900}

.switch{width:56px;height:32px;border-radius:999px;background:var(--stone);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--leaf)}

.goals{display:grid;gap:10px}
.goal{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:16px;padding:14px 16px;font-weight:900}

/* guidebook */
.sheetpage{position:absolute;inset:0;z-index:22;background:var(--paper);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.sheetpage.open{transform:none}
.sheetpage .panel{flex:1}
.gcard{border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.gcard b{display:block;font-weight:900;margin-bottom:6px}
.gcard .ex{font-family:var(--f-display);font-weight:900;font-size:28px;letter-spacing:2px}

.words{display:flex;flex-wrap:wrap;gap:8px}
.words span{border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-weight:900}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;padding:14px 18px;border-radius:16px;font-weight:900;font-size:17px;letter-spacing:.8px;text-transform:uppercase;color:#fff;background:var(--beaver);box-shadow:0 5px 0 var(--beaver-deep);transition:transform .08s,box-shadow .08s;position:relative;overflow:hidden}
.btn{border-radius:14px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--beaver-deep)}
.btn.green{background:var(--leaf);box-shadow:0 5px 0 var(--leaf-deep)}
.btn.blue{background:var(--sky);box-shadow:0 5px 0 var(--sky-deep)}
.btn.red{background:var(--berry);box-shadow:0 5px 0 var(--berry-deep)}
.btn.ghost{background:var(--paper);color:var(--sky-deep);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.danger{background:var(--paper);color:var(--berry-deep);box-shadow:0 5px 0 var(--berry-tint);border:2px solid var(--berry-tint)}
.btn:disabled{background:var(--line);color:var(--stone-deep);box-shadow:0 5px 0 var(--stone);cursor:default}
.btn i.timer{position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.6);width:0;animation:fill var(--t,6s) linear forwards}

/* ---------- lesson ---------- */
.lesson{position:absolute;inset:0;background:var(--paper);z-index:20;display:flex;flex-direction:column;overflow:hidden;overflow:clip;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.3,1)}
.lesson.open{transform:none}
.lhead{flex:none;display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.lclose{width:36px;height:36px;display:grid;place-items:center;color:var(--stone-deep)}
.lclose svg{width:26px;height:26px}
.lbar{flex:1;height:12px;border-radius:999px;background:repeating-linear-gradient(90deg,#E5D3B3 0 12px,transparent 12px 18px);overflow:visible;position:relative;margin-right:14px}
.lbar i{display:block;position:relative;height:100%;width:0;background:linear-gradient(#B98249,#8C5A2B);border-radius:999px;box-shadow:inset 0 4px 0 rgba(255,255,255,.35);transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.lbar i::after{content:"🦫";position:absolute;right:-16px;top:-14px;font-size:24px;line-height:1}
.combo{position:absolute;right:0;top:-24px;font-size:12px;font-weight:900;color:#FF7A00;white-space:nowrap;opacity:0;transition:opacity .3s}
.combo.show{opacity:1;animation:bump .5s}
.lbody{flex:1;min-height:0;overflow-y:auto;padding:6px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.ltag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900;color:var(--grape-deep);text-transform:uppercase;letter-spacing:1px}
.ltype{font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1.15;margin-top:-8px}
.prompt{display:flex;align-items:flex-end;gap:8px}
.bubble{position:relative;flex:1;min-width:0;border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:900;font-size:18px;line-height:1.3;display:flex;align-items:center;gap:10px;background:var(--paper)}
.bubble::before{content:"";position:absolute;left:-10px;bottom:16px;width:16px;height:16px;background:var(--paper);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.speak{flex:none;width:44px;height:44px;border-radius:14px;background:var(--sky);box-shadow:0 4px 0 var(--sky-deep);display:grid;place-items:center;color:#fff}
.speak svg{width:26px;height:26px}
.speak.playing{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.listen{display:flex;justify-content:center;gap:14px;align-items:flex-end;padding:10px 0}
.bigspeak{width:120px;height:120px;border-radius:28px;background:var(--sky);box-shadow:0 7px 0 var(--sky-deep);display:grid;place-items:center;color:#fff}
.bigspeak svg{width:64px;height:64px}
.turtle{width:72px;height:72px;border-radius:20px;background:var(--sky);box-shadow:0 6px 0 var(--sky-deep);display:grid;place-items:center;font-size:36px}
.eq{background:var(--mist);border-radius:22px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.groups{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.grp{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:130px;background:var(--paper);border:2px dashed var(--line);border-radius:16px;padding:6px}
.obj{font-size:34px;line-height:1;width:48px;height:48px;display:grid;place-items:center;position:relative;border-radius:10px}
.obj .c{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 4px;border-radius:999px;background:var(--beaver);color:#fff;font-family:var(--f-display);font-weight:900;font-size:14px;display:grid;place-items:center;animation:pop .3s}
.obj.tapped{animation:wiggle .35s}
@keyframes wiggle{30%{transform:rotate(-14deg) scale(1.15)}70%{transform:rotate(10deg)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}}
.plus{font-family:var(--f-display);font-weight:900;font-size:34px;color:var(--beaver)}
.sum{font-family:var(--f-display);font-weight:900;font-size:46px;line-height:1;display:flex;align-items:center;gap:12px}
.sum .q{display:inline-grid;place-items:center;min-width:60px;height:60px;border-radius:14px;border:3px dashed var(--beaver);color:var(--beaver)}
.sum .q.typed{border-style:solid;background:var(--beaver-tint)}
.sum .q.ok{border-style:solid;background:var(--leaf);border-color:var(--leaf);color:#fff;animation:pop .4s}
.sum .q.no{border-style:solid;background:var(--berry-tint);border-color:var(--berry);color:var(--berry-deep);animation:shake .4s}
.hint{font-size:13px;color:var(--ink-soft);text-align:center;margin:0;font-weight:800}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answers.wide{grid-template-columns:1fr}
.answers .ans.opt{font-family:var(--f-body);font-size:20px;font-weight:800;min-height:64px;padding:8px 10px}
.mcqv{min-height:120px;justify-content:center}
.bigemo{font-size:72px;line-height:1}
.clk{width:150px;height:150px}
.coins{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.coins svg{display:block}
.topic{display:flex;align-items:center;gap:12px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;width:100%;text-align:left;font-weight:800}
.topic .ti2{font-size:30px}
.topic small{display:block;font-weight:700;color:var(--ink-soft);font-size:13px}
.topic[aria-pressed="true"]{border-color:var(--leaf);box-shadow:0 4px 0 var(--leaf);background:var(--leaf-tint)}
.topic .tk{margin-left:auto;font-size:20px}
.topic.soon{opacity:.55;cursor:default}
.ans,.pic,.mt,.tile,.key{border:2px solid var(--line);box-shadow:0 5px 0 var(--line);background:var(--paper);transition:transform .08s}
.ans:active,.pic:active,.mt:active,.tile:active,.key:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.ans{min-height:76px;border-radius:18px;font-family:var(--f-display);font-weight:900;font-size:40px}
.ans.txt{font-family:var(--f-body);font-size:20px;font-weight:900;min-height:58px}
.right{background:var(--leaf-tint)!important;border-color:var(--leaf)!important;box-shadow:0 5px 0 var(--leaf)!important;color:var(--leaf-deep)}
.wrong{background:var(--berry-tint)!important;border-color:var(--berry)!important;box-shadow:0 5px 0 var(--berry)!important;color:var(--berry-deep);animation:shake .4s}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pic{border-radius:18px;padding:12px 4px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px;min-height:120px;font-size:30px}
.bigsum{font-family:var(--f-display);font-weight:900;font-size:56px;text-align:center;line-height:1}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:58px;border-radius:16px;font-family:var(--f-display);font-weight:900;font-size:28px;display:grid;place-items:center}
.key svg{width:28px;height:28px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:grid;gap:12px}
.mt{min-height:70px;border-radius:16px;font-family:var(--f-display);font-weight:900;font-size:34px;display:grid;place-items:center;padding:4px}
.mt.pics2{font-size:24px;letter-spacing:-2px}
.mt.sel{border-color:var(--sky);background:var(--sky-tint);box-shadow:0 5px 0 var(--sky)}
.mt.matched{opacity:.35;box-shadow:none;transform:none;border-color:var(--line);background:var(--mist)}
.bankline{min-height:72px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{min-width:54px;height:58px;border-radius:14px;font-family:var(--f-display);font-weight:900;font-size:30px;display:grid;place-items:center;padding:0 12px}
.tile.used{visibility:hidden}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lfoot{flex:none;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:2px solid var(--line)}

/* stories */
.scene{border-radius:22px;background:linear-gradient(180deg,var(--sky-tint),#E9F7E1);padding:16px;display:flex;justify-content:center;align-items:flex-end;gap:16px;min-height:120px;font-size:52px}
.sline{display:flex;gap:10px;align-items:flex-end;animation:slidein .35s ease}
.sline .who{width:52px;height:52px;border-radius:50%;background:var(--mist);display:grid;place-items:center;font-size:30px;flex:none;overflow:hidden;padding-top:10px}
.sline .who.e{padding-top:0}
.sline .sb{border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:800;font-size:17px;line-height:1.35}
.sline .sb small{display:block;font-weight:900;font-size:12px;color:var(--ink-soft);letter-spacing:.8px;text-transform:uppercase}
.sq{border:2px solid #CDB4F5;background:var(--grape-tint);border-radius:18px;padding:12px;display:grid;gap:10px;animation:slidein .35s ease}
.sq b{font-weight:900;color:var(--grape-deep)}
@keyframes slidein{from{opacity:0;transform:translateY(12px)}}

.fb{position:absolute;left:0;right:0;bottom:0;z-index:25;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.9,.3,1);display:flex;align-items:center;gap:14px}
.fb.show{transform:none}
.fb{left:10px!important;right:10px!important;bottom:10px!important;border-radius:26px;border:3px solid var(--line);box-shadow:0 12px 30px rgba(59,42,30,.25);transform:translateY(140%)}
.fb.show{transform:none}
.fb.good{background:#F2F8E6;border-color:#C5DFA6;color:#3F7A1F}
.fb.bad{background:#FFF4EA;border-color:#F2CBA8;color:#A9531E}
.fb .face{background:radial-gradient(ellipse at 50% 100%,#5E3A1A 0 26%,transparent 27%),#FFFCF5!important}
.fb .face{width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:end center;overflow:hidden;flex:none;padding-top:14px}
.fb.good .face .bv{animation:cheer .5s ease-in-out infinite alternate}
.fb.bad .face .bv{transform:rotate(-8deg) translateY(2px)}
@keyframes cheer{from{transform:translateY(4px)}to{transform:translateY(-4px) rotate(4deg)}}
.fb b{display:block;font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1.1}
.fb span.t{font-weight:900;font-size:15px}
.fb .auto{position:absolute;left:0;bottom:0;height:5px;background:currentColor;opacity:.35;width:0}
.fb.show .auto{animation:fill var(--dur,2s) linear forwards}
@keyframes fill{to{width:100%}}

/* result screens */
.result{position:absolute;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));text-align:center;animation:slidein .35s ease}
.result .dm{animation:bob 1.2s ease-in-out infinite}
.result h2{font-family:var(--f-display);font-weight:900;font-size:32px;margin:0;color:var(--sun-deep);line-height:1.1;text-wrap:balance}
.result p{margin:0;color:var(--ink-soft);font-weight:800}
.result .btn{max-width:340px}
.result .list{width:100%;max-width:340px;text-align:left}
.bigstars{display:flex;gap:6px;align-items:flex-end}
.bigstars svg{width:50px;height:50px;opacity:.18;transform:scale(.6);transition:all .4s cubic-bezier(.3,1.7,.5,1)}
.bigstars svg.on{opacity:1;transform:none}
.bigstars svg:nth-child(2){width:62px;height:62px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.c3{border-radius:16px;border:2px solid;overflow:hidden;text-align:center}
.c3 small{display:block;color:#fff;font-weight:900;font-size:11px;letter-spacing:.8px;padding:4px 2px;text-transform:uppercase}

.c3.xp{border-color:var(--sun)}.c3.xp small{background:var(--sun)}.c3.xp b{color:var(--sun-deep)}
.c3.tm{border-color:var(--sky)}.c3.tm small{background:var(--sky)}.c3.tm b{color:var(--sky-deep)}
.c3.ac{border-color:var(--leaf)}.c3.ac small{background:var(--leaf)}.c3.ac b{color:var(--leaf-deep)}
.bigflame{font-size:110px;line-height:1;animation:bump 1s ease 2}
.hint2{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);z-index:24;background:#FFF4EA;border:2px solid #F2CBA8;color:#A9531E;border-radius:18px;padding:10px 16px;font-weight:800;font-size:16px;white-space:nowrap;box-shadow:0 6px 14px rgba(0,0,0,.12);animation:pop .3s}
.calm{position:absolute;inset:0;z-index:30;background:linear-gradient(#DDEEF7,#FFFCF5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.calm h2{margin:0;font-family:var(--f-display);font-size:26px}
.calm p{margin:0;font-weight:800;color:var(--ink-soft);font-size:18px}

let voice=null;
const speakBtns=on=>document.querySelectorAll(".speak,.bigspeak").forEach(b=>b.classList.toggle("playing",on));
function say(name,onEnd,rate=1){
  if(voice){voice.onended=null;voice.onerror=null;voice.pause();voice=null}
  speakBtns(false);
  if(!S.voice){onEnd&&onEnd();return}
  const a=new Audio("audio/"+(S.lang==="fr"&&!/^(en|rep)\d/.test(name)?"fr/":"")+name+".mp3");voice=a;a.playbackRate=rate;
  if(name.startsWith("q_"))speakBtns(true);
  const end=()=>{speakBtns(false);onEnd&&onEnd()};
  a.onended=end;a.onerror=end;
  a.play().catch(()=>speakBtns(false));
}
let ac=null;
function tone(seq){
  if(!S.fx)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  const t0=ac.currentTime;
  seq.forEach(([f,st,du,type="sine",vol=.18])=>{
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t0+st);g.gain.linearRampToValueAtTime(vol,t0+st+.02);g.gain.exponentialRampToValueAtTime(.001,t0+st+du);
    o.connect(g).connect(ac.destination);o.start(t0+st);o.stop(t0+st+du+.05);
  });
}

function rnd(seed){let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);return ((h>>>0)%10000)/10000}
function leagueTable(week,tier,frac){
  const scale=1+tier*.35;
  const rows=BOTS.map(([n,e],i)=>{const fin=Math.round((25+rnd(week+tier+n)*190)*scale),pace=.6+rnd(n+week)*.8;
    return {n,e,xp:Math.round(fin*Math.min(1,frac*pace))}});
  return rows;
}
function weekFrac(){const s=weekStart().getTime();return Math.max(.04,Math.min(1,(Date.now()-s)/(7*864e5)))}
function standings(){
  const rows=leagueTable(S.league.week,S.tier,weekFrac());rows.push({n:"You",e:"",me:true,xp:S.league.xp});
  rows.sort((a,b)=>b.xp-a.xp||(a.me?-1:1));return rows;
}
let leagueNews=null;
function rollWeek(){
  const w=weekId();
  if(S.league.week===w)return;
  if(S.league.week){
    const rows=leagueTable(S.league.week,S.tier,1);rows.push({me:true,xp:S.league.xp});rows.sort((a,b)=>b.xp-a.xp);
    const rank=rows.findIndex(r=>r.me)+1;
    if(S.league.xp>0&&rank<=3)S.top3++;
    if(S.league.xp>0&&rank<=3&&S.tier<9){S.tier++;leagueNews={up:true,rank}}
    else if(rank>=13&&S.tier>0){S.tier--;leagueNews={up:false,rank}}
  }
  S.league={week:w,xp:0};save();
}

  const jump=opts.jump,z=jump!==undefined?jump:zoneOf(g),t=jump!==undefined?"test":opts.heal?"practice":nodeType(g);
  if(dayDone())return dayDoneModal();

  L={g,z,node:t,correct:0,mistakes:0,answered:0,row:0,bestRow:0,t0:Date.now(),jump,heal:!!opts.heal};
  if(t==="story"){L.story=storyFor(g);L.si=0;L.total=L.story.length}
  else{L.sk=skillFor(S.age,S.diff,z);
    const tops=S.topics.filter(x=>x!=="math"&&COURSE.some(c=>c.id===x&&!c.soon)),topic=(t==="lesson"&&!S.topics.includes("math"))?topicOf(g):"mix";L.topic=topic;
    if(topic==="clock"||topic==="money")L.queue=Array.from({length:5},()=>makeMcq(topic));
    else{L.queue=(jump!==undefined?TEST_PLAN:opts.heal?HEAL_PLAN:planFor(g)).map(type=>newEx(type));
      /* practice and tests mix in the other topics the parents picked */
      if(t==="lesson"&&L.queue.length>3)L.queue.splice(2,1,newEx("teach")); /* once a lesson Domi answers, sometimes wrong on purpose */
      if(topic==="mix"&&tops.length){const n=t==="lesson"?tops.length:Math.min(3,tops.length*2);for(let i=0;i<n;i++)L.queue.splice(1+i*2,1,makeMcq(tops[i%tops.length]))}
      if(!S.topics.includes("math")&&tops.length)L.queue=L.queue.map((e,i)=>e.type==="mcq"?e:makeMcq(tops[i%tops.length]))}
    L.total=L.queue.length}
  {const w=wkLog(),tp=L.topic&&L.topic!=="mix"?L.topic:"math";if(!w.topics.includes(tp))w.topics.push(tp);S.lastTopic=tp}
  $("lBar").style.width="0";$("result").hidden=true;$("combo").className="combo";
  $("fbFace").innerHTML=bv(60);
  renderStats();
  if(jump!==undefined)$("lHearts").querySelector("span").textContent=3;
  $("lesson").classList.add("open");$("lesson").setAttribute("aria-hidden","false");
  if(t==="story"){say("story");renderStory()}else nextExercise(380);
}

/* numbers in words: English, Farsi, French; digits in any script. Returns the last number said ("one plus one is two" -> 2) */
const NUMW={zero:0,one:1,two:2,to:2,too:2,three:3,tree:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,
  "صفر":0,"یک":1,"یه":1,"دو":2,"سه":3,"چهار":4,"پنج":5,"شش":6,"شیش":6,"هفت":7,"هشت":8,"نه":9,"ده":10,"یازده":11,"دوازده":12,"سیزده":13,"چهارده":14,"پانزده":15,"پونزده":15,"شانزده":16,"شونزده":16,"هفده":17,"هیفده":17,"هجده":18,"هیجده":18,"نوزده":19,"بیست":20,"سی":30,"چهل":40,"پنجاه":50,"شصت":60,"هفتاد":70,"هشتاد":80,"نود":90,
  "zéro":0,"un":1,"une":1,"deux":2,"trois":3,"quatre":4,"cinq":5,"sept":7,"huit":8,"neuf":9,"dix":10,"onze":11,"douze":12,"treize":13,"quatorze":14,"quinze":15,"seize":16,"vingt":20,"trente":30,"quarante":40,"cinquante":50,"soixante":60};
const HUNDRED={hundred:1,"صد":1,cent:1};
/* English said while the recogniser listens for Farsi often comes back in Farsi letters */
const WEAKW={"وان":1,"تو":2,"تری":3,"فور":4,"فایو":5,"سیکس":6,"سون":7,"ایت":8,"ناین":9,"تن":10};
function heardNumber(text){
  const t=text.toLowerCase().replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/(\d),(\d)/g,"$1$2");
  const words=t.split(/[^0-9a-zà-ÿ\u0600-\u06FF]+/).filter(Boolean);
  let last=null,cur=null,joinNext=false,weak=null;
  const flush=()=>{if(cur!==null)last=cur;cur=null};
  for(const w of words){
    let v=null;
    if(/^\d+$/.test(w))v=+w;else if(w in NUMW)v=NUMW[w];
    if(w in HUNDRED){cur=(cur||1)*100;joinNext=true;continue}
    if(v===null){if((w==="و"||w==="and"||w==="et")&&cur!==null){joinNext=true;continue}if(w in WEAKW)weak=WEAKW[w];flush();joinNext=false;continue}
    if(cur!==null&&(joinNext||(cur%10===0&&cur>=20&&v<10))&&v<cur)cur+=v;else{flush();cur=v}
    joinNext=false;
  }
  flush();
  return last!==null?last:weak;
}
const normWords=t=>t.toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(Boolean);

      $("tapAlt").innerHTML=`<div class="answers">${[...o].sort(()=>Math.random()-.5).map(v=>`<button class="ans" data-v="${v}">${v}</button>`).join("")}</div>`;

function answer(ok,correctText,btn,skipped,goodTitle){
  const ex=L.ex;if(ex.locked)return;ex.locked=true;
  /* first slip: Domi gives a hint and the child tries again */
  if(!ok&&!skipped&&!ex.retried&&ex.type!=="match"&&L.jump===undefined){ex.retried=true;L.mistakes++;return tryAgain(ex,btn)}
  {const w=wkLog();w.q++;if(ok)w.right++}
  if(!skipped){qDay().n++;save()}
  $("lBody").querySelectorAll(".ans,.pic,.key,.tile,.mt").forEach(b=>b.disabled=true);$("lCheck").disabled=true;$("lSkip").disabled=true;
  if(btn)btn.classList.add(ok?"right":"wrong");
  L.answered++;
  const lesson=L;let moved=false;
  const go=()=>{if(moved||L!==lesson||!$("lesson").classList.contains("open"))return;moved=true;nextExercise()};
  const fbBtn=$("fbBtn");
  const showFb=(good,title,sub,secs)=>{$("fbTitle").textContent=title;$("fbSub").textContent=sub;
    fbBtn.className="btn "+(good?"green":"red");fbBtn.innerHTML=`Continue<i class="timer" style="--t:${secs}s"></i>`;$("fb").className="fb "+(good?"good":"bad")+" show"};
  if(ok){
    L.correct++;L.row++;L.bestRow=Math.max(L.bestRow,L.row);L.miss=0;
    $("lBar").style.width=(L.correct/L.total*100)+"%";
    if(L.row>=3){const c=$("combo");c.textContent=`⭐ ${L.row} in a row!`;c.className="combo";void c.offsetWidth;c.className="combo show"}
    sfx.good();burst(45);
    showFb(true,goodTitle||(L.row>=3?["Domi is so proud!","Hop hop hooray!","You're on a roll!"][L.row%3]:["Yay! You got it!","Domi is dancing!","Super smart!","Woohoo!"][Math.floor(Math.random()*4)]),correctText,3);
    fbBtn.onclick=()=>{sfx.tap();go()};
    const t0=Date.now();
    say("praise"+(1+Math.floor(Math.random()*4)),()=>setTimeout(go,Math.max(150,1300-(Date.now()-t0))));
    setTimeout(go,3200);
  }else{
    L.mistakes++;L.row=0;$("combo").className="combo";
    {const c=Object.assign({},ex);delete c.locked;delete c.pending;delete c.chosen;L.queue.push(c)} /* wrong ones come back at the end */
    sfx.bad();
    if(L.jump!==undefined){$("lHearts").querySelector("span").textContent=Math.max(0,3-L.mistakes);bump("lHearts")}

    showFb(false,skipped?"Let's look together":"Here's how:",skipped?"Answer: "+correctText:correctText,5);
    L.miss=(L.miss||0)+1;
    const after=()=>{if(L===lesson&&L.miss>=2&&L.jump===undefined){L.miss=0;calmCorner(()=>{if(L===lesson){L.queue.unshift(easierEx());go()}})}else go()};
    let done=false;const once=()=>{if(!done){done=true;after()}};
    fbBtn.onclick=()=>{sfx.tap();once()};
    say("wrong",()=>setTimeout(once,500));setTimeout(once,5500);
  }
}

  answer(false,ex.type==="match"?"Match each pair":ex.type==="mcq"?(ex.answerText||ex.opts[ex.ans].replace(/<[^>]+>/g,"")):`${expr(ex)} = ${ex.ans}`,null,true)};

  let gems=first&&L.mistakes===0?5:0;if(first&&t==="test")gems+=20;S.gems+=gems;
  let newDay=false,freezeUsed=false;
  if(S.lastDay!==today()){

    else if(S.lastDay===daysAgo(2)&&S.freezes>0){S.freezes--;S.streak++;freezeUsed=true;S.freezeDays.push(daysAgo(1))}
    else S.streak=1;

  if(!S.days.includes(today()))S.days.push(today());S.days=S.days.slice(-40);
  const q=questsToday(),Q=QUESTS(),before=Q.map(d=>Math.min(q[d.id],d.target));
  q.xp+=xp;q.holes+=1;q.row=Math.max(q.row,L.bestRow);

  save();
  const secs=Math.round((Date.now()-L.t0)/1000),acc=Math.max(0,Math.round(L.correct/Math.max(1,L.answered)*100));
  const rank=standings().findIndex(r=>r.me)+1;

      after:()=>{const r=$("result");r.querySelectorAll(".bigstars svg").forEach((s,k)=>{if(k<stars)setTimeout(()=>{s.classList.add("on");sfx.count(k*3)},350+k*330)});
        let n=0;const tk=setInterval(()=>{n++;const e=$("xpTick");if(e)e.textContent="+"+n;if(n>=xp)clearInterval(tk)},40)}};
  });

    return {html:`<div class="bigflame">🪵</div><div class="bignum">${S.streak}</div><h2 style="color:var(--wood-deep)">${S.streak===1?"log on Domi's dam!":"logs on Domi's dam!"}</h2>

        if(Qn.some((d,i)=>before[i]<d.target&&q[d.id]>=d.target))setTimeout(()=>say("quest"),400)}}));

  if(kind==="player"){
    h=`<p class="dh">Players</p><div class="courses">`+P.list.map(p=>{const st=p.id===P.cur?S:peek(p.id),stars=(st.stars||[]).reduce((x,y)=>x+y,0);
      return `<button class="crs ${p.id===P.cur?"on":""}" data-pl="${p.id}"><span class="ci" style="background:${p.color}">${p.name.trim()[0].toUpperCase()}</span><span style="flex:1;min-width:0">${p.name}<small>⚡ ${st.xp||0} XP · 🕳️ ${st.pos||0}/${TOTAL} holes · ⭐ ${stars}</small></span>${p.id===P.cur?"✓":""}</button>`}).join("")+`</div>
      <div class="addpl"><input id="plName" maxlength="16" placeholder="New player's name" aria-label="New player's name"><button class="btn green" id="plAdd">Add</button></div>
`;
  }
  if(kind==="streak")h=`<div class="sthead"><span class="bigf">🪵</span><div><b>Domi's dam: ${S.streak} ${S.streak===1?"day":"days"}</b><small>${S.lastDay===today()?"You added today's log!":"Do a lesson today to add a log to the dam!"}</small></div></div>
      ${monthCal()}<p class="dsub">☂️ ${S.freezes} ${S.freezes===1?"umbrella":"umbrellas"} to keep the dam safe on a missed day</p>`;
  if(kind==="gems")h=`<div class="sthead"><span class="bigf">🌰</span><div><b>${S.gems} acorns</b><small>Spend them in your burrow on umbrellas and outfits for Domi.</small></div></div><button class="btn blue" id="dShop">Open my burrow</button>`;
  if(kind==="hearts"){regen();const mins=S.heartT?Math.max(1,Math.ceil((HEART_MS-(Date.now()-S.heartT)%HEART_MS)/60000)):30;
    h=`<p class="dh" style="text-align:center">Hearts</p><div class="hearts5">${"❤️".repeat(S.hearts)+"🤍".repeat(5-S.hearts)}</div>
      <p class="dsub">${S.hearts>=5?"You have full hearts! Keep on learning.":`Next heart in ${mins} min`}</p>
      ${S.hearts<5?`<button class="btn blue" id="dRefill" ${S.gems<30?"disabled":""}>Refill for 30 💎</button><button class="btn green" id="dPractice">Practice to earn hearts</button>`:""}`}
  $("drop").innerHTML=h;$("drop").classList.add("show");$("dim").classList.add("show");btn.setAttribute("aria-expanded","true");
  $("drop").querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{if(b.dataset.pl===P.cur)return;switchPlayer(b.dataset.pl)});
  if($("plAdd"))$("plAdd").onclick=()=>{const n=$("plName").value.trim();if(!n){$("plName").focus();return}
    const id="p"+Date.now();P.list.push({id,name:n,color:PCOLORS[P.list.length%PCOLORS.length]});savePlayers();
    try{const st=fresh();st.seen=true;st.lang=S.lang;localStorage.setItem(keyFor(id),JSON.stringify(st))}catch(e){}
    switchPlayer(id)};

  if($("dShop"))$("dShop").onclick=()=>{closeDrop();switchTab("profile")};
  if($("dRefill"))$("dRefill").onclick=()=>{S.gems-=30;S.hearts=5;save();sfx.coin();closeDrop();renderStats();bump("sHearts")};
  if($("dPractice"))$("dPractice").onclick=()=>{closeDrop();openLesson(Math.max(0,S.pos-1),{heal:true})};
}
$("dim").onclick=closeDrop;
$("tbCourse").onclick=()=>openDrop("player",$("tbCourse"));
function switchPlayer(id){
  save();P.cur=id;savePlayers();loadState();rollWeek();questsToday();monthly();save();
  closeDrop();switchTab("learn");renderMap();placeBeaver(false);scrollToCurrent(false);
  sfx.fanfare();toast(`Hi, ${curPlayer().name}! 👋`);
}
$("sStreak").onclick=()=>openDrop("streak",$("sStreak"));
$("sGems").onclick=()=>openDrop("gems",$("sGems"));
$("sHearts").onclick=()=>openDrop("hearts",$("sHearts"));

/* ================= tabs ================= */
const TAB_INTRO={quests:["t_missions","These are Domi's missions! New ones every day."],profile:["t_burrow","Welcome to Domi's burrow: your prizes, stickers and outfits."],parents:["t_parents","This place is for mums and dads."]};
const tabSeen=new Set();
function tabIntro(t){if(tabSeen.has(t)||!TAB_INTRO[t])return;tabSeen.add(t);const [clip,txt]=TAB_INTRO[t];setTimeout(()=>{say(clip);toast("🦫 "+txt)},250)}
function switchTab(t,quiet){
  if(t!=="learn"&&!quiet)tabIntro(t);
  if(t==="parents")return askParents();
  closePop();closeDrop();$("guide").classList.remove("open");
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  $("map").hidden=t!=="learn";
  ["quests","shop","profile"].forEach(k=>{const el=$("p"+k[0].toUpperCase()+k.slice(1));el.hidden=t!==k;el.scrollTop=0});
  $("pSettings").hidden=true;$("intro").classList.remove("show");
  ({quests:renderQuests,profile:renderProfile})[t]?.();
  if(t==="learn"){placeBeaver(false);scrollToCurrent(false);updateUnit()}
  checkJump();
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{sfx.tap();switchTab(b.dataset.tab)});

/* ================= confetti ================= */
const cv=$("fx"),cx=cv.getContext("2d");let parts=[],raf=0;
const COLORS=["#FF8A1F","#FFC72E","#36C25B","#3BA7FF","#FF5468","#A05CF0"];
function size(){const r=$("phone").getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio}
function burstFrom(x,y,n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  size();
  for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,sp=4+Math.random()*9;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,w:6+Math.random()*7,h:4+Math.random()*5,c:COLORS[k%COLORS.length],life:90+Math.random()*40})}
  if(!raf)raf=requestAnimationFrame(tick);
}
function burst(n){const r=$("phone").getBoundingClientRect();burstFrom(r.width/2,r.height*.4,n)}
function burstAt(el,n){if(!el)return;const p=$("phone").getBoundingClientRect(),r=el.getBoundingClientRect();burstFrom(r.left-p.left+r.width/2,r.top-p.top+r.height/2,n)}
function tick(){
  const d=devicePixelRatio;cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life-->0);
  for(const p of parts){p.vy+=.35;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x*d,p.y*d);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.life/30);cx.fillStyle=p.c;cx.fillRect(-p.w*d/2,-p.h*d/2,p.w*d,p.h*d);cx.restore()}
  raf=parts.length?requestAnimationFrame(tick):0;
}

/* ================= start ================= */
const clk=()=>{const d=new Date();$("clock").textContent=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")};clk();setInterval(clk,30000);
rollWeek();questsToday();monthly();renderMap();
requestAnimationFrame(()=>{placeBeaver(false);scrollToCurrent(false)});
function startMap(){
  placeBeaver(false);scrollToCurrent(true);
  setTimeout(()=>{
    if(false){const n=leagueNews;leagueNews=null;sfx.fanfare();modal(`<div class="chest">${TIERS[S.tier][1]}</div><h3>${n.up?"You moved up!":"New week, new league"}</h3><p>You finished #${n.rank} last week. Welcome to the ${TIERS[S.tier][0]} League!</p>`,[{label:"Let's go!",cls:"green",go:()=>introZone(curZone())}])}
    else introZone(curZone());
  },500);
}
let entered=false;
function enterApp(){
  if(entered)return;entered=true;
  $("splash").classList.add("gone");setTimeout(()=>$("splash").hidden=true,450);
  if(S.seen)return startMap();
  /* first run: pick a daily goal, like Duolingo's onboarding */
  const o=$("onb");o.hidden=false;
  o.innerHTML=`<div class="prompt">${bv(90)}<div class="bubble">How much do you want to learn each day?</div></div><div class="goals">${goalsHTML()}</div><button class="btn green" id="onbGo">Continue</button>`;
  say("welcome");
  o.querySelectorAll(".goal").forEach(b=>b.onclick=()=>{S.goal=+b.dataset.g;sfx.tap();o.querySelectorAll(".goal").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $("onbGo").onclick=()=>{sfx.tap();S.seen=true;save();o.hidden=true;startMap()};
}
/* the splash shows Domi waving, then goes in by itself; a tap goes in sooner */
$("splash").onclick=enterApp;
setTimeout(enterApp,2200);
})();
