<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="fur" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#C8854A"/><stop offset="1" stop-color="#9A5A2B"/></radialGradient>
    <radialGradient id="bel" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#FFE8CC"/><stop offset="1" stop-color="#F2C9A0"/></radialGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6E4A2E"/><stop offset="1" stop-color="#4E3220"/></linearGradient>
  </defs>
  <!-- tail -->
  <g transform="rotate(-28 150 150)"><ellipse cx="160" cy="150" rx="22" ry="38" fill="url(#tail)"/>
    <path d="M146 128 l28 8 M144 142 l32 9 M145 157 l30 8 M148 171 l24 7" stroke="#8A6444" stroke-width="2.5" stroke-linecap="round" opacity=".7"/></g>
  <!-- body -->
  <ellipse cx="100" cy="148" rx="46" ry="42" fill="url(#fur)"/>
  <ellipse cx="100" cy="152" rx="32" ry="32" fill="url(#bel)"/>
  <!-- feet -->
  <ellipse cx="74" cy="186" rx="17" ry="9" fill="#7A4A26"/><ellipse cx="126" cy="186" rx="17" ry="9" fill="#7A4A26"/>
  <!-- arms -->
  <ellipse cx="62" cy="146" rx="11" ry="17" fill="#A9652F" transform="rotate(20 62 146)"/>
  <ellipse cx="138" cy="146" rx="11" ry="17" fill="#A9652F" transform="rotate(-20 138 146)"/>
  <!-- ears -->
  <circle cx="58" cy="46" r="16" fill="#A9652F"/><circle cx="58" cy="46" r="9" fill="#F3B49A"/>
  <circle cx="142" cy="46" r="16" fill="#A9652F"/><circle cx="142" cy="46" r="9" fill="#F3B49A"/>
  <!-- head -->
  <ellipse cx="100" cy="78" rx="56" ry="50" fill="url(#fur)"/>
  <!-- muzzle -->
  <ellipse cx="100" cy="98" rx="27" ry="20" fill="#FFE8CC"/>
  <!-- eyes -->
  <ellipse cx="78" cy="75" rx="12.5" ry="15" fill="#2B1A12"/><ellipse cx="122" cy="75" rx="12.5" ry="15" fill="#2B1A12"/>
  <circle cx="83" cy="69" r="5.5" fill="#fff"/><circle cx="127" cy="69" r="5.5" fill="#fff"/>
  <circle cx="75" cy="79" r="2" fill="#fff" opacity=".8"/><circle cx="119" cy="79" r="2" fill="#fff" opacity=".8"/>
  <!-- brows -->
  <path d="M70 54 q8 -5 16 -2 M114 52 q8 -3 16 2" stroke="#7A4622" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".7"/>
  <!-- cheeks -->
  <ellipse cx="64" cy="94" rx="10" ry="6.5" fill="#FF8F8F" opacity=".55"/><ellipse cx="136" cy="94" rx="10" ry="6.5" fill="#FF8F8F" opacity=".55"/>
  <!-- nose -->
  <path d="M91 88 q9 -6 18 0 q-2 8 -9 9 q-7 -1 -9 -9z" fill="#3A2216"/>
  <ellipse cx="97" cy="89" rx="3" ry="1.6" fill="#fff" opacity=".6"/>
  <!-- smile -->
  <path d="M86 101 q14 12 28 0" stroke="#3A2216" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- teeth -->
  <rect x="93" y="104" width="7" height="10" rx="2" fill="#fff" stroke="#E3D3C2" stroke-width="1"/>
  <rect x="100" y="104" width="7" height="10" rx="2" fill="#fff" stroke="#E3D3C2" stroke-width="1"/>
  <!-- tuft -->
  <path d="M94 34 q4 -10 8 -2 q4 -8 7 3" stroke="#9A5A2B" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
