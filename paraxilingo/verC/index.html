<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Paraxilingo C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: one iPhone-sized screen in the full Duolingo shell — Learn (sticky unit banner + picture map), Leagues, Quests, Shop, Profile. Lessons, stories, result screens, guidebook and pop-up cards slide over it. */
:root{
  --ink:#3B2A1E;--ink-soft:#7A6552;--paper:#FFFFFF;--mist:#F6EEDF;--line:#EADCC4;
  --beaver:#D9772E;--beaver-deep:#9E5320;--beaver-tint:#FBEBDB;
  --leaf:#6BA539;--leaf-deep:#4A7A22;--leaf-tint:#EAF3DA;
  --berry:#D4593A;--berry-deep:#A23E22;--berry-tint:#FBE6DE;
  --sun:#F2B533;--sun-deep:#BD8516;--sun-tint:#FCF1D3;
  --sky:#3C8EC0;--sky-deep:#276A93;--sky-tint:#E1EFF7;
  --wood:#B87B42;--wood-deep:#7A4A1E;
  --grape:#A05CF0;--grape-deep:#7B3BCB;--grape-tint:#F1E6FF;
  --stone:#C8C6D3;--stone-deep:#9A97AB;--desk:#1E2A44;
  --f-display:"Fredoka","M PLUS Rounded 1c",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"M PLUS Rounded 1c",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.stage{height:100%;display:grid;place-items:center;grid-template-rows:100%;grid-template-columns:100%}
.phone{position:relative;width:100%;height:100%;min-height:0;max-height:100%;background:var(--paper);overflow:hidden;overflow:clip;display:flex;flex-direction:column}
.island,.statusbar{display:none}
@media (min-width:560px) and (min-height:720px){
  .stage{background:radial-gradient(1200px 600px at 70% 10%,#2F4775 0%,transparent 60%),var(--desk)}
  .stage{grid-template-columns:auto}
  .phone{width:390px;height:min(844px,calc(100% - 40px));border-radius:56px;border:11px solid #0E0E14;box-shadow:0 0 0 2px #3A3A48,0 40px 80px rgba(0,0,0,.45)}
  .island{display:block;position:absolute;top:10px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#0E0E14;z-index:90}
  .statusbar{display:flex;justify-content:space-between;align-items:center;height:46px;padding:0 30px;font-weight:900;font-size:15px;background:var(--paper);flex:none}
  .statusbar .sig{display:flex;gap:5px;align-items:center}
  .over{top:46px!important}
}

/* Domi with his outfit */
.bv{position:relative;display:inline-block;line-height:0;flex:none}
.bv img{width:100%;display:block}
.bv .acc{position:absolute;left:50%;transform:translateX(-50%);line-height:1;pointer-events:none}
.acc.hat{top:-26%;font-size:calc(var(--w)*.42)}
.acc.crown{top:-24%;font-size:calc(var(--w)*.38)}
.acc.glasses{top:24%;font-size:calc(var(--w)*.36)}
.acc.bow{top:-6%;left:70%;font-size:calc(var(--w)*.3)}

/* ---------- top bar ---------- */
.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--paper);border-bottom:2px solid var(--line);z-index:5}
.course{width:40px;height:40px;border-radius:50%;background:var(--pc,#3BA7FF);box-shadow:0 3px 0 rgba(0,0,0,.18);color:#fff;font-family:var(--f-display);font-weight:900;font-size:18px;position:relative;display:grid;place-items:center;flex:none}
.course .gb{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;line-height:1}
.stats{display:flex;gap:6px;align-items:center;flex:1;justify-content:space-around}
.stat{display:flex;align-items:center;gap:4px;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.stat svg{width:22px;height:22px}
.stat.flame.off{color:var(--stone-deep)}
.stat.flame.off svg{filter:grayscale(1);opacity:.5}
.stat.flame{color:var(--wood-deep)}.stat .emo{font-size:20px;line-height:1}.stat.gem{color:var(--sky)}.stat.heart{color:var(--berry)}.stat.xp{color:var(--sun-deep)}
.stat.bump{animation:bump .5s}
.boost{font-size:12px;font-weight:900;color:#fff;background:var(--grape);border-radius:999px;padding:2px 8px}
@keyframes bump{40%{transform:scale(1.35)}}

/* ---------- learn: picture map ---------- */
.map{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;background:var(--paper)}
.unitbar{position:sticky;top:0;z-index:7;padding:10px 12px;background:linear-gradient(var(--paper) 70%,transparent)}
.unit{display:flex;align-items:center;gap:10px;color:#FFF6E6;border-radius:12px;padding:10px 10px 10px 20px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 3px,transparent 3px 9px),linear-gradient(#C98F55,#A8713C);border:3px solid var(--wood-deep);box-shadow:inset 9px 0 0 var(--uc,#3FAE49),0 4px 0 #5E3A16;transition:box-shadow .4s;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.unit .guide{color:#FFF6E6}
.unit .ut{flex:1;min-width:0}
.unit small{display:block;font-size:12px;font-weight:900;letter-spacing:1px;opacity:.9;text-transform:uppercase}
.unit b{display:block;font-family:var(--f-display);font-weight:900;font-size:21px;line-height:1.1}
.guide{align-self:stretch;display:grid;place-items:center;border-left:2px solid rgba(0,0,0,.16);padding:0 4px 0 14px;color:#fff}
.guide svg{width:28px;height:28px}
.jumpbtn{border:2px solid rgba(255,255,255,.75);border-radius:12px;padding:8px 10px;font-weight:900;font-size:13px;color:#fff;white-space:nowrap;letter-spacing:.5px}
.journey{position:relative;display:flex;flex-direction:column}
.zone{position:relative;width:100%;content-visibility:auto;contain-intrinsic-size:auto 600px}
.zbg{position:absolute;inset:0;overflow:hidden}
.zbg img{position:absolute;inset:0;width:100%;height:100%;display:block}
/* the grey copy covers everything Domi has not reached yet, fading into colour just above him */
.zbg img.gr{filter:grayscale(1) brightness(1.06) contrast(.92);-webkit-mask-image:linear-gradient(to bottom,#000 calc(var(--cut,110%) - 7%),transparent var(--cut,110%));mask-image:linear-gradient(to bottom,#000 calc(var(--cut,110%) - 7%),transparent var(--cut,110%));transition:opacity .8s}
.zone.locked .zbg img{filter:grayscale(1) brightness(1.06) contrast(.92)}

.hole{position:absolute;transform:translate(-50%,-50%);z-index:1}
.hole.sg{width:10.6%;aspect-ratio:1.75;display:grid;place-items:center;border-radius:8px;color:var(--dc)}
.hole.sg svg{width:38%;height:auto}
.hole.sg.future{color:#8E8C99}
.hole.sg.future svg{width:34%}
.hole.sg .rwi{font-size:min(6vw,24px);line-height:1}
.hole.sg .st{top:auto;bottom:6%;margin:0;background:none;box-shadow:none;padding:0}
.hole.sg .st svg{width:9px;height:9px}
.hole.sg:active{transform:translate(-50%,-50%) scale(.94)}
.hole.current .cic{position:absolute;inset:0;display:grid;place-items:center;color:var(--dc);font-size:30px}
.hole.current .cic svg{width:30px;height:30px}
.hole .st{position:absolute;top:100%;margin-top:4px;left:50%;transform:translateX(-50%);display:flex;gap:1px;background:rgba(255,255,255,.94);border-radius:999px;padding:1px 5px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.hole .st svg{width:11px;height:11px}
.rewards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rw{border:2px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center;font-size:30px}
.rw.lock{filter:grayscale(1);opacity:.45}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.theme{border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:16px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:30px}
.theme small{font-size:12px;font-weight:800;color:var(--ink-soft)}
.theme[aria-pressed="true"],.chip[aria-pressed="true"]{border-color:var(--sky);box-shadow:0 4px 0 var(--sky);background:var(--sky-tint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:48px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:14px;padding:10px 12px;font-weight:800;font-size:17px}
.chip small{display:block;font-size:11px;color:var(--ink-soft);font-weight:700}
.chip.lockd{opacity:.7;cursor:default}
.ptitle{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.ptitle .pe{font-size:44px}
.sample{margin-top:10px;background:var(--mist);border-radius:14px;padding:10px 14px;font-weight:800;color:var(--ink-soft)}
.sample b{font-family:var(--f-display);font-size:22px;color:var(--ink);font-weight:600}
.pinpad{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center;margin:10px 0}
.pinpad button{height:56px;border-radius:16px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--f-display);font-weight:600;font-size:26px}
.pindots{display:flex;gap:10px;justify-content:center;min-height:18px}
.pindots i{width:14px;height:14px;border-radius:50%;background:var(--ink)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.parentsbtn{display:flex;align-items:center;justify-content:center;gap:8px}
.parentsbtn .pe{font-size:22px}
.hole.current{width:100px;height:100px;border-radius:50%}
.hole.current .ringsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.hole.current.chest .cic{font-size:40px;animation:wobble 1.2s ease-in-out infinite}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px 0}
.microw{display:flex;gap:14px;justify-content:center;align-items:stretch}
.micpill{width:190px;height:84px;border-radius:22px;background:var(--sky);box-shadow:0 7px 0 var(--sky-deep);color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .2s}
.micpill i{width:10px;height:10px;border-radius:5px;background:#fff;transition:height .15s}
.micpill.on{background:var(--sky)}
.micpill.on i{animation:wv .55s ease-in-out infinite alternate}
.micpill.on i:nth-child(2n){animation-delay:.15s}.micpill.on i:nth-child(3n){animation-delay:.3s}.micpill.on i:nth-child(5n){animation-delay:.42s}
.micpill.idle{background:#E5E5EA;box-shadow:0 7px 0 #CFCFD6}
.micpill.idle i{background:#A9A9B3}
.micpill.off{background:#E5E5EA;box-shadow:0 7px 0 #CFCFD6;color:#9A97AB}
.micpill.off svg{width:34px;height:34px}
@keyframes wv{from{height:10px}to{height:34px}}
.refresh{width:84px;border-radius:22px;border:2px solid var(--line);box-shadow:0 5px 0 var(--line);display:grid;place-items:center;color:var(--sky)}
.refresh svg{width:38px;height:38px}
#micMsg{min-height:22px;max-width:32ch;text-align:center;margin:0}
.anslang{display:flex;gap:6px;justify-content:center;align-items:center;font-weight:800;font-size:13px;color:var(--ink-soft)}
.anslang button{border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px;color:var(--ink-soft)}
.anslang button[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-tint);color:var(--sky-deep)}
.saidit{display:grid;gap:10px}
.cardstack{position:relative;width:250px;height:250px;margin:18px auto 8px}
.cardstack::before,.cardstack::after{content:"";position:absolute;left:14px;right:14px;top:-10px;height:40px;border:2px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;background:#F7F7F9}
.cardstack::after{left:28px;right:28px;top:-19px;background:#FBFBFC}
.wcard{position:absolute;inset:0;z-index:1;border:2px solid var(--line);border-radius:28px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;text-align:center}
.wcard .wpic{font-size:30px;line-height:1.15;max-width:200px;word-break:break-all}
.wcard b{font-family:var(--f-display);font-weight:600;font-size:44px;line-height:1;color:var(--ink)}
.wcard small{font-weight:700;font-size:20px;color:var(--ink-soft)}
.wcard.flip{animation:cardin .35s ease-out}
@keyframes cardin{from{transform:translateX(40px) rotate(6deg);opacity:0}}
.repeat{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:10px}
.repeat .rb{position:relative;border:2px solid var(--line);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;color:var(--sky-deep);background:#fff}
.repeat .rb::after{content:"";position:absolute;left:50%;bottom:-11px;width:18px;height:18px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.repeat .rb span{border-bottom:2px dashed #9CC9F0;line-height:1.35}
.repeat .rb button{color:var(--sky);flex:none}.repeat .rb button svg{width:30px;height:30px}
.repeat .bvbig{margin-top:8px}
#tapAlt{align-self:stretch}
.nomic{font-size:13px;font-weight:700;color:var(--ink-soft);text-align:center;margin:0;max-width:34ch}
.mt.expr{font-size:24px}
.cant{align-self:center;font-weight:800;color:#AFAFBA;text-transform:uppercase;letter-spacing:.8px;font-size:15px;padding:10px 12px;margin-top:6px}
@keyframes ring{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.25);opacity:0}}
.tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--paper);color:var(--tc,var(--beaver));font-weight:900;font-size:14px;padding:4px 12px;border-radius:12px;border:2px solid var(--line);white-space:nowrap;animation:float 1.6s ease-in-out infinite;letter-spacing:.8px}
.tip::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:var(--paper);border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
@keyframes float{50%{margin-bottom:6px}}

.beaver{position:absolute;width:64px;height:58px;overflow:visible;z-index:4;cursor:pointer;transition:left 1.1s cubic-bezier(.45,.05,.4,1),top 1.1s cubic-bezier(.45,.05,.4,1)}
.beaver .bv{margin-top:0;animation:peek 2.6s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.beaver.popin .bv{animation:popin .55s cubic-bezier(.3,1.6,.5,1) both}
.beaver.walking{overflow:visible}
.beaver.walking .bv{animation:hop .28s ease-in-out infinite alternate}
.beaver.flip .bv{scale:-1 1}
.beaver.away{display:none}
@keyframes peek{0%,100%{transform:translateY(3px)}50%{transform:translateY(-3px) rotate(-3deg)}}
@keyframes popin{from{transform:translateY(72px)}to{transform:translateY(0)}}
@keyframes hop{from{transform:translateY(-10px) rotate(-6deg)}to{transform:translateY(-26px) rotate(6deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px) rotate(-2deg)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg) scale(1.08)}75%{transform:rotate(10deg) scale(1.08)}}

.pop{position:absolute;z-index:6;width:270px;border-radius:20px;padding:14px 16px 16px;color:#fff;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);transform-origin:var(--ax) 0;animation:popcard .25s cubic-bezier(.3,1.5,.5,1);background:var(--pc)}
.pop::before{content:"";position:absolute;top:-8px;left:var(--ax);width:18px;height:18px;margin-left:-9px;background:inherit;transform:rotate(45deg);border-radius:3px}
.pop h4{margin:0;font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1.1}
.pop p{margin:0;font-weight:800;opacity:.92;font-size:14px}
.pop .pstars{display:flex;gap:2px}.pop .pstars svg{width:18px;height:18px}
.pop .btn{background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);color:var(--pc);margin-top:4px}
@keyframes popcard{from{transform:scale(.6);opacity:0}}

.jump{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:84px;z-index:6;width:54px;height:54px;border-radius:50%;background:var(--paper);box-shadow:0 5px 0 var(--line),0 6px 18px rgba(0,0,0,.18);display:grid;place-items:center;overflow:hidden}
.intro{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:130px;z-index:8;display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:22px;padding:10px 16px 10px 10px;border:2px solid var(--line);box-shadow:0 6px 0 var(--line),0 10px 24px rgba(0,0,0,.18);transform:translateX(-120%);transition:transform .45s cubic-bezier(.3,1.4,.5,1);cursor:pointer}
@media (min-width:560px) and (min-height:720px){.intro{top:176px}}
.intro.show{transform:none}
.intro .it{flex:1;min-width:0}
.intro .ik{font-size:12px;font-weight:900;color:var(--ink-soft);letter-spacing:1px;text-transform:uppercase}
.intro .in{font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1.1}
.intro .io{font-size:34px}

/* ---------- tab bar ---------- */
.tabbar{flex:none;display:flex;justify-content:space-around;background:var(--paper);border-top:2px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:5}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:70px;height:54px;border-radius:14px;border:2px solid transparent;color:var(--ink-soft)}
.tab small{font-size:11px;font-weight:800;letter-spacing:.2px}
.tab svg{width:30px;height:30px}
.tab .te{font-size:28px;line-height:1;filter:grayscale(.3)}
.tab[aria-selected="true"]{background:var(--sky-tint);border-color:#A9D6FF;color:var(--sky-deep)}
.tab[aria-selected="true"] .te{filter:none}
.tab .dot{position:absolute;top:2px;right:6px;width:12px;height:12px;border-radius:50%;background:var(--berry);border:2px solid var(--paper)}

/* ---------- panels ---------- */
.panel{flex:1;min-height:0;background:var(--paper);overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.panel h2{font-family:var(--f-display);font-weight:900;font-size:28px;margin:0;line-height:1.15}
.panel h3{font-family:var(--f-display);font-weight:900;font-size:20px;margin:22px 0 10px}
.panel p.sub{margin:2px 0 14px;color:var(--ink-soft);font-weight:700}
.hero{display:flex;align-items:center;gap:14px;color:#fff;border-radius:22px;padding:14px 16px;margin-bottom:6px;background:var(--grape)}
.hero b{display:block;font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1.1}
.hero span.s{font-weight:700;opacity:.92;font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:2px solid var(--line)}
.row:last-child{border-bottom:0}
.qi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none}
.qb{flex:1;min-width:0}
.qb b{display:block;font-weight:900;font-size:16px;margin-bottom:6px}
.qb small{display:block;color:var(--ink-soft);font-weight:700;margin:-4px 0 6px}
.pbar{position:relative;height:18px;border-radius:999px;background:var(--line);overflow:hidden}
.pbar i{position:absolute;inset:0 auto 0 0;background:var(--sun);border-radius:999px;box-shadow:inset 0 4px 0 rgba(255,255,255,.35);transition:width .8s cubic-bezier(.3,1.2,.5,1)}
.pbar span{position:relative;display:block;text-align:center;font-size:12px;font-weight:900;line-height:18px;color:var(--ink-soft)}
.chestbtn{width:46px;height:46px;font-size:32px;line-height:1;flex:none;display:grid;place-items:center;border-radius:14px}
.chestbtn.ready{animation:wobble 1.2s ease-in-out infinite;background:var(--sun-tint)}
.chestbtn.claimed{opacity:.35;filter:grayscale(1)}
.chestbtn:disabled:not(.claimed){opacity:.45;filter:grayscale(.7);cursor:default}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;border:2px solid var(--line);border-radius:20px;padding:12px 10px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:900;color:var(--ink-soft)}
.week .d{width:34px;height:34px;border-radius:50%;background:var(--mist);display:grid;place-items:center;font-size:18px}
.week .on .d{background:#FFE6C7}
.week .fz .d{background:var(--sky-tint)}

.topic{display:flex;align-items:center;gap:12px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;width:100%;text-align:left;font-weight:800}

.ans,.pic,.mt,.tile,.key{border:2px solid var(--line);box-shadow:0 5px 0 var(--line);background:var(--paper);transition:transform .08s}

.lfoot{flex:none;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:2px solid var(--line)}

/* stories */
.scene{border-radius:22px;background:linear-gradient(180deg,var(--sky-tint),#E9F7E1);padding:16px;display:flex;justify-content:center;align-items:flex-end;gap:16px;min-height:120px;font-size:52px}

.fb{position:absolute;left:0;right:0;bottom:0;z-index:25;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.9,.3,1);display:flex;align-items:center;gap:14px}

.fb{left:10px!important;right:10px!important;bottom:10px!important;border-radius:26px;border:3px solid var(--line);box-shadow:0 12px 30px rgba(59,42,30,.25);transform:translateY(140%)}

/* modal & toast */
.modal{position:absolute;inset:0;z-index:40;background:rgba(30,24,52,.55);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));opacity:0;pointer-events:none;transition:opacity .25s}

.card h3{font-family:var(--f-display);font-weight:900;font-size:28px;margin:0;line-height:1.15;text-wrap:balance}

/* ===================== verC question pages: "Candy Meadow" palette =====================
   Soft sky-to-cream background, white cards, four pastel answer tints (lilac, mint, peach, sky),
   sunshine-yellow speaker, mint for right, gentle coral for "try again" (never harsh red). */
:root{
  --q-ink:#26334D;--q-soft:#6B7890;--q-card:#FFFFFF;
  --q-sun:#FFC93C;--q-sun-d:#E7A400;
  --q-mint:#3DBE86;--q-mint-d:#2A9A6A;--q-mint-t:#E2F7EC;
  --q-sky:#4E9BEA;--q-sky-d:#3878C4;--q-sky-t:#E6F1FF;
  --q-coral:#FF8C82;--q-coral-t:#FFF0EE;
  --q-lilac:#8E7CF0;
}
.lesson.q2{background:linear-gradient(180deg,#E6F3FF 0%,#F4F8FF 38%,#FFF7EC 100%);color:var(--q-ink)}
.lesson.q2 .lhead{display:flex;align-items:center;gap:12px;padding:12px 16px 4px}
.lesson.q2 .lclose{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--q-soft);border:0;box-shadow:0 3px 10px rgba(38,51,77,.10);display:grid;place-items:center;flex:none}
.lesson.q2 .lclose svg{width:18px;height:18px}
.qdots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.qdots i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2.5px #D5DEEC;transition:.3s}
.qdots i.on{background:var(--q-mint);box-shadow:0 0 0 3px #C9F0DD;transform:scale(1.1)}
.qbody{flex:1;overflow-y:auto;padding:6px 18px 120px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.qbody.in>*{animation:qin .45s cubic-bezier(.3,1.4,.5,1) both}
.qbody.in>*:nth-child(2){animation-delay:.06s}.qbody.in>*:nth-child(3){animation-delay:.12s}
@keyframes qin{from{opacity:0;transform:translateY(16px) scale(.97)}}
.qtop{display:flex;align-items:center;gap:12px;justify-content:center;min-height:76px}
.qspk{position:relative;width:76px;height:76px;border-radius:50%;border:0;flex:none;color:#5A3B00;
  background:radial-gradient(circle at 35% 30%,#FFE58A,var(--q-sun) 60%);box-shadow:0 6px 0 var(--q-sun-d),0 10px 22px rgba(231,164,0,.35);display:grid;place-items:center}
.qspk svg{width:38px;height:38px}
.qspk:active{transform:translateY(4px);box-shadow:0 2px 0 var(--q-sun-d)}
.qspk::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:4px solid var(--q-sun);opacity:0}
.qspk.talking::after{animation:ring 1.2s ease-out infinite}
@keyframes ring{from{opacity:.9;transform:scale(.92)}to{opacity:0;transform:scale(1.35)}}
.qtop .cap{font-weight:800;font-size:15px;color:var(--q-soft);max-width:220px;line-height:1.3}
.qvis{background:var(--q-card);border-radius:28px;box-shadow:0 10px 28px rgba(38,51,77,.08);padding:20px 14px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative}
.qvis .clk{width:170px;height:170px}
.qvis .clk.hintclk line:last-of-type{stroke:#FF8C82;filter:drop-shadow(0 0 4px #FF8C82)}
.bignum{font-family:var(--f-display);font-weight:700;font-size:96px;line-height:1;color:var(--q-lilac);text-shadow:0 5px 0 #E4DEFF}
.bignum.sm{font-size:72px}
.bignum.q{color:#C3CCDB;text-shadow:0 5px 0 #EEF2F8}
.seq{display:flex;align-items:center;gap:14px}.seq .arr{font-size:34px;color:#B9C3D3}
.bigemo{font-size:88px;line-height:1}.bigemo.soft{opacity:.85;font-size:64px}
.listen{width:120px;height:120px;border-radius:50%;background:linear-gradient(160deg,#F1ECFF,#E6F1FF);display:grid;place-items:center;font-size:66px;box-shadow:inset 0 -6px 0 rgba(142,124,240,.12)}
.listen.radio{background:linear-gradient(160deg,#FFF0E6,#FFF7D6)}
.domisays{display:flex;align-items:flex-end;gap:6px}
.domisays .bub{background:var(--q-sky-t);border-radius:24px 24px 24px 6px;padding:14px 18px;font-family:var(--f-display);font-size:34px;color:var(--q-ink)}
.domisays.big .pe{font-size:84px;line-height:1;display:block}
.grp{display:flex;flex-wrap:wrap;gap:2px 4px;justify-content:center;max-width:220px}
.grp .ob{font-style:normal;font-size:30px;line-height:1.1;position:relative;transition:transform .2s}
.qvis .grp .ob{font-size:38px}
.ob.gone{opacity:.25;filter:grayscale(1);transform:translateY(-6px) rotate(-12deg)}
.ob.counted{transform:scale(1.15)}
.ob.counted::after{content:attr(data-n);position:absolute;top:-10px;right:-8px;min-width:20px;height:20px;border-radius:10px;background:var(--q-sky);color:#fff;font:700 12px/20px var(--f-display);text-align:center;font-style:normal;box-shadow:0 2px 0 var(--q-sky-d)}
.ob.dot{font-size:14px;color:var(--q-lilac)}
.story2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.story2 .op{font-family:var(--f-display);font-size:40px;color:var(--q-sun-d)}
.story2 .gift{font-family:var(--f-display);font-size:26px;background:var(--q-coral-t);border-radius:16px;padding:4px 10px;color:#C2554B}
.qvis .eq{display:flex;flex-direction:row;background:none;padding:0;border:0;box-shadow:none;width:auto;align-items:flex-start;gap:10px;font-family:var(--f-display);font-weight:700;font-size:64px;line-height:1}
.qvis .eq>span{display:flex;flex-direction:column;align-items:center;gap:6px}
.qvis .eq>b{color:var(--q-sun-d);font-weight:700}
.qvis .eq .q{color:#C3CCDB}
.dots{font-size:11px;letter-spacing:2px;color:var(--q-lilac);max-width:70px;line-height:1.2;text-align:center;word-break:break-all;font-family:system-ui}
.coinname{font-family:var(--f-display);font-size:24px;color:var(--q-soft)}
.ctag{font:700 14px var(--f-display);background:var(--q-sun);color:#5A3B00;border-radius:999px;padding:1px 8px;margin:-8px 2px 0}
.nline{display:flex;gap:6px;margin-top:6px}
.nline span{width:34px;height:34px;border-radius:10px;background:#F2F5FA;display:grid;place-items:center;font:700 17px var(--f-display);color:var(--q-soft)}
.nline span.hi{background:var(--q-sky);color:#fff}
/* answers */
.qopts{display:grid;gap:12px}
.qopts.row3{grid-template-columns:repeat(3,1fr)}
.qopts.row,.qopts.yn{grid-template-columns:1fr 1fr}
.qopts.grid{grid-template-columns:1fr 1fr}
.qopts.col{grid-template-columns:1fr}
.qo{--bg:#fff;--bd:#E2E8F2;--sh:#C9D3E3;--ink:var(--q-ink);position:relative;border:3px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--sh);min-height:108px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .12s,box-shadow .12s,opacity .3s,filter .3s;font-family:var(--f-display)}
.qo:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}
.qo.t0{--bg:#F3EFFF;--bd:#CFC2FF;--sh:#A898F5;--ink:#4B3A99}
.qo.t1{--bg:#E8F9F1;--bd:#A6E6C9;--sh:#5BC796;--ink:#1E6B4D}
.qo.t2{--bg:#FFF2E9;--bd:#FFCDB0;--sh:#F3A274;--ink:#8A4423}
.qo.t3{--bg:#EAF4FF;--bd:#B3D5FF;--sh:#6EA8EC;--ink:#23528F}
.qo .num{font-size:46px;line-height:1;font-weight:700}
.qo .num.t{font-size:30px}
.qo .yn{font-size:52px;line-height:1}
.qo .oe{font-size:44px;line-height:1}
.qo small{font:700 14px var(--f-body,inherit);opacity:.85}
.qo .grp .ob{font-size:26px}
.qopts.col .qo{min-height:72px;flex-direction:row}
.qo.right{--bg:var(--q-mint-t);--bd:var(--q-mint);--sh:var(--q-mint-d);animation:pop .4s}
.qo.right::after,.qo.show::after{content:"✓";position:absolute;top:-10px;right:-8px;width:30px;height:30px;border-radius:50%;background:var(--q-mint);color:#fff;font:700 18px/30px var(--f-display);text-align:center;box-shadow:0 3px 0 var(--q-mint-d)}
.qo.show{--bg:var(--q-mint-t);--bd:var(--q-mint);--sh:var(--q-mint-d);animation:glowq 1.2s ease-in-out infinite}
.qo.wrong{--bd:var(--q-coral);animation:shake .4s}
.qo.faded{opacity:.35;filter:grayscale(.6);pointer-events:none}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes glowq{50%{box-shadow:0 6px 0 var(--q-mint-d),0 0 0 8px rgba(61,190,134,.25)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.qhint{position:absolute;left:50%;top:76px;transform:translateX(-50%);z-index:30;background:#fff;color:var(--q-ink);font-weight:800;border-radius:999px;padding:10px 18px;box-shadow:0 8px 24px rgba(38,51,77,.18);white-space:nowrap;animation:qin .35s both}
/* bottom sheet */
.qsheet{position:absolute;left:0;right:0;bottom:0;z-index:25;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;transform:translateY(110%);transition:transform .35s cubic-bezier(.3,1.3,.5,1);box-shadow:0 -8px 30px rgba(38,51,77,.12)}
.qsheet.show{transform:none}
.qsheet.good{background:#E3F8EE}.qsheet.learn{background:#E8F2FF}
.qsrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qsrow .qsf{width:62px;height:62px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.qsrow b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1}
.qsheet.good b{color:#1F8A5B}.qsheet.learn b{color:#2D62B5}
.qsrow span span{display:block;font-weight:800;font-size:17px;color:var(--q-ink);margin-top:3px;line-height:1.35}
.qbtn{width:100%;border:0;border-radius:20px;min-height:56px;font:700 20px var(--f-display);color:#fff;letter-spacing:.3px;transition:transform .1s,box-shadow .1s}
.qbtn:active{transform:translateY(4px)}
.qbtn.good{background:var(--q-mint);box-shadow:0 5px 0 var(--q-mint-d)}
.qbtn.learn,.qbtn.sky{background:var(--q-sky);box-shadow:0 5px 0 var(--q-sky-d)}
.qbtn:disabled{background:#D7DEE9;box-shadow:0 5px 0 #BCC6D6}
.qbtn.big{min-height:62px;font-size:22px}
.qbtn.pulse{animation:pop 1s ease-in-out infinite}
/* radio */
.radio{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:10px}
.rbox{position:relative;width:170px;height:170px;border-radius:40px;background:linear-gradient(160deg,#FFE7D1,#FFD3B0);display:grid;place-items:center;box-shadow:0 8px 0 #F3A274,0 16px 30px rgba(243,162,116,.35)}
.rbox .remo{font-size:96px}
.rbox .rwave{position:absolute;inset:-12px;border-radius:50px;border:5px solid #FFB98A;opacity:0}
.rbox.on .rwave{animation:wavec 1.4s ease-out infinite}.rbox.on .r2{animation-delay:.7s}
@keyframes wavec{from{transform:scale(.9);opacity:.9}to{transform:scale(1.3);opacity:0}}
.rtitle{font-family:var(--f-display);font-size:28px;color:var(--q-ink)}
.rbtns{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;width:100%;max-width:340px}
/* praise dance */
.dance{position:absolute;inset:0;z-index:28;display:grid;place-items:center;pointer-events:none}
.dance .bv{animation:dancea .45s ease-in-out 4 alternate}
.dance .tx{position:absolute;bottom:30%;font-family:var(--f-display);font-weight:700;font-size:32px;color:#F29A00;text-shadow:0 3px 0 #fff}
@keyframes dancea{from{transform:rotate(-12deg) translateY(0)}to{transform:rotate(12deg) translateY(-24px)}}
/* end of a mound: always a party, never a score */
.qresult{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:linear-gradient(180deg,#FFF6DA,#FFE9F1 60%,#E9F1FF);overflow:hidden}
.qresult .rs-sun{position:absolute;top:8%;width:420px;height:420px;border-radius:50%;background:repeating-conic-gradient(rgba(255,201,60,.35) 0 10deg,transparent 10deg 24deg);animation:spin 14s linear infinite}
.qresult .dm{position:relative;animation:dancea .5s ease-in-out 6 alternate}
.qresult h2{position:relative;margin:0;font-family:var(--f-display);font-size:38px;color:#F29A00;text-shadow:0 3px 0 #fff}
.qresult p{position:relative;margin:0;font-weight:800;font-size:18px;color:var(--q-soft)}
.gains{position:relative;display:flex;gap:10px;margin:6px 0 10px}
.gn{font-family:var(--f-display);font-size:28px;background:#fff;border-radius:20px;padding:8px 18px;box-shadow:0 5px 0 rgba(38,51,77,.08)}
.qresult .qbtn{position:relative;max-width:320px}
/* top bar and intro, softer */
.topbar{background:#fff;box-shadow:0 4px 16px rgba(38,51,77,.06);border-bottom:0}
.stat{background:#FFF4E2;border-radius:999px;padding:5px 12px 5px 8px}
.stat#sWood{background:#F4EBE2}
.tbtn{border:0;background:#F3F6FB;box-shadow:0 3px 0 #DCE3EE}
.introC{background:linear-gradient(180deg,#E6F3FF 0%,#FFF7EC 100%)}
.introC .mcard{background:#fff;border:0;box-shadow:0 10px 28px rgba(38,51,77,.08);border-radius:28px}
.introC .mcard b{color:var(--q-ink)}
.introC .mcard .mm{color:var(--q-lilac)}
.introC .btn.green{background:var(--q-mint);box-shadow:0 5px 0 var(--q-mint-d);border-radius:20px}
.introC .talk{animation:floaty 3.5s ease-in-out infinite}

.domisays .bub.q{font-size:64px;color:var(--q-lilac);padding:6px 26px}
.tgrp{display:flex;gap:10px;align-items:center;margin-top:6px}
.tgrp .op{font:700 28px var(--f-display);color:var(--q-sun-d)}

.qvis .bigpic{font-size:110px;line-height:1;filter:drop-shadow(0 6px 4px rgba(38,51,77,.12))}
.qsrow .qsf{font-size:34px}
/* intro: just Domi */
.introC .talk{width:260px;max-width:70%}
.introC .inev{font-size:44px;min-height:10px}
/* parents: graphic */
#pSettings{background:linear-gradient(180deg,#F4F8FF,#FFF8EF)}
.phead{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.phead .pav{width:44px;height:44px;border-radius:50%;color:#fff;display:grid;place-items:center;font:700 22px var(--f-display)}
.phead b{font:700 26px var(--f-display);color:var(--q-ink)}
.phead .pweek{margin-left:auto;font-weight:800;font-size:13px;color:var(--q-soft);background:#fff;border-radius:999px;padding:4px 10px}
.ptiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pt1{background:#fff;border-radius:20px;padding:12px 6px;text-align:center;box-shadow:0 6px 18px rgba(38,51,77,.06)}
.pt1 i{font-style:normal;font-size:24px;display:block}
.pt1 b{display:block;font:700 30px var(--f-display);color:var(--q-ink);line-height:1.1}
.pt1 small{font-weight:800;color:var(--q-soft);font-size:12px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}
.pchips span{background:#fff;border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(38,51,77,.05)}
.ptalk{display:grid;gap:6px}
.ptalk div{background:#FFF4DC;border-radius:16px;padding:10px 12px;font-weight:700;font-size:14px;line-height:1.35;color:#6B4A00}
.ptalk div+div{background:#EDE8FF;color:#43349A}
.psec{display:flex;align-items:center;gap:8px;margin:24px 0 10px;font:700 19px var(--f-display);color:var(--q-ink)}
.psec span{width:34px;height:34px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:19px;box-shadow:0 3px 10px rgba(38,51,77,.06)}
.plegend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.plegend span{font-weight:800;font-size:13px;color:var(--q-soft);background:#fff;border-radius:999px;padding:4px 10px}
.pprize{display:grid;grid-template-columns:56px 1fr 1fr auto;align-items:center;gap:8px;background:#fff;border-radius:22px;padding:10px 12px;margin-bottom:10px;box-shadow:0 6px 18px rgba(38,51,77,.06)}
.pprize.ok{box-shadow:0 0 0 3px var(--q-mint),0 6px 18px rgba(38,51,77,.06)}
.ppe{font-size:40px;text-align:center}
.ppr{display:flex;flex-direction:column;align-items:center;gap:2px}
.pring{width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--c) var(--f),#EEF1F6 0);display:grid;place-items:center}
.pring i{font-style:normal;width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:18px}
.pnum{font:700 12px var(--f-display);color:var(--q-soft)}
.pstep{display:flex;gap:4px}
.pstep .stp{width:28px;height:24px;border-radius:8px;border:0;background:#F1F4F9;font-weight:900;color:var(--q-soft)}
.pdays{font-weight:800;font-size:13px;color:var(--q-soft);white-space:nowrap}
.pgive{border:0;border-radius:14px;background:var(--q-mint);color:#fff;font:700 14px var(--f-display);padding:10px 10px;box-shadow:0 3px 0 var(--q-mint-d)}
.pseg{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:18px;padding:5px;gap:5px;box-shadow:0 6px 18px rgba(38,51,77,.06)}
.pseg.lv{grid-template-columns:repeat(3,1fr)}
.pseg button{border:0;border-radius:14px;background:transparent;min-height:46px;font:700 20px var(--f-display);color:var(--q-soft)}
.pseg.lv button{font-size:26px}
.pseg button[aria-pressed="true"]{background:var(--q-sky);color:#fff;box-shadow:0 3px 0 var(--q-sky-d)}
.ptopics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ptopics.two{grid-template-columns:1fr 1fr}
.ptopics button{border:0;border-radius:18px;background:#fff;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 #E3E8F0;opacity:.55;filter:grayscale(.7);transition:.15s}
.ptopics button i{font-style:normal;font-size:28px}
.ptopics button small{font-weight:800;font-size:11px;color:var(--q-ink)}
.ptopics button[aria-pressed="true"]{opacity:1;filter:none;box-shadow:0 0 0 3px var(--q-mint),0 4px 0 var(--q-mint-d)}
.pages{display:flex;flex-wrap:wrap;gap:6px}
.pages button{width:44px;height:44px;border-radius:50%;border:0;background:#fff;font:700 18px var(--f-display);color:var(--q-soft);box-shadow:0 3px 0 #E3E8F0}
.pages button[aria-pressed="true"]{background:var(--q-lilac);color:#fff;box-shadow:0 3px 0 #6A57D6;transform:scale(1.1)}
.psample{margin-top:8px;text-align:center;font:700 18px var(--f-display);color:var(--q-soft)}
.pmonths{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pmonths button{border:0;border-radius:14px;background:#fff;padding:6px 2px;font-weight:800;font-size:12px;color:var(--q-soft);display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 #E3E8F0}
.pmonths button i{font-style:normal;font-size:20px}
.pmonths button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--q-sky),0 3px 0 var(--q-sky-d);color:var(--q-ink)}
.preset{width:100%;border:0;background:transparent;color:#C2554B;font-weight:800;font-size:15px;padding:12px}
.pconf{display:grid;grid-template-columns:1fr 80px 80px;gap:8px;align-items:center}
.pconf[hidden]{display:none}
/* tablets: bigger everything */
@media (min-width:700px){
  .qspk{width:100px;height:100px}.qspk svg{width:50px;height:50px}
  .qtop .cap{font-size:19px;max-width:360px}
  .qvis{min-height:300px;border-radius:36px}
  .bignum{font-size:140px}.bignum.sm{font-size:100px}
  .bigemo,.qvis .bigpic{font-size:150px}.listen{width:170px;height:170px;font-size:96px}
  .qvis .clk{width:240px;height:240px}
  .qvis .eq{font-size:96px}.qvis .grp .ob{font-size:54px}.grp{max-width:340px}
  .qo{min-height:150px;border-radius:30px}.qo .num{font-size:64px}.qo .yn{font-size:76px}.qo .oe{font-size:64px}.qo small{font-size:18px}.qo .grp .ob{font-size:38px}
  .qopts{gap:18px}.qdots i{width:18px;height:18px}
  .qsheet{max-width:680px;margin:0 auto}
  .introC .talk{width:340px}
}
/* painting */
.paint{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.pcanvas{width:min(100%,520px);background:#fff;border-radius:32px;box-shadow:0 10px 28px rgba(38,51,77,.10);padding:10px}
.pcanvas svg{width:100%;height:auto;display:block;touch-action:manipulation}
.psvg .rg{cursor:pointer;transition:fill .2s}
.psvg .rg.pop{animation:rgpop .35s}
@keyframes rgpop{50%{opacity:.75}}
.ppal{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:min(100%,520px)}
.pot{aspect-ratio:1/1;border-radius:50%;border:4px solid #fff;background:var(--c);box-shadow:0 5px 0 rgba(38,51,77,.18),inset 0 -6px 0 rgba(0,0,0,.12);transition:transform .15s}
.pot.on{transform:scale(1.15);box-shadow:0 0 0 4px var(--q-ink),0 5px 0 rgba(38,51,77,.18)}
.pot[data-n="white"]{border-color:#DDE3EC}
.pbtns{display:grid;grid-template-columns:1fr 3fr;gap:12px;width:min(100%,520px)}
.pgal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.pthumb{background:#fff;border-radius:14px;padding:4px;box-shadow:0 3px 10px rgba(38,51,77,.08)}
.pthumb svg{width:100%;height:auto;display:block}
.pthumb .rg{stroke-width:7}
/* the option being read aloud */
.qo.saying{transform:translateY(-4px) scale(1.04);box-shadow:0 10px 0 var(--sh),0 0 0 5px rgba(255,201,60,.55)}
/* new Domi */
.bv img{width:100%;height:auto;display:block}
.introC .talk{animation:hopi 1.6s ease-in-out infinite;filter:drop-shadow(0 14px 16px rgba(38,51,77,.18))}
@keyframes hopi{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
.introC{cursor:pointer}
.zbg img.gr{filter:saturate(.3) brightness(1.08) contrast(.95)}
/* Watcher pictures, swatches, patterns */
.wp{display:block;width:120px;height:120px;object-fit:contain}
.wp.op{width:72px;height:72px}
.wp.big{width:170px;height:170px}
.qo .oe.big{font-size:56px}
.swatch{width:56px;height:56px;border-radius:50%;background:var(--c);border:3px solid rgba(0,0,0,.08);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.pat{display:flex;gap:6px;align-items:center;font-size:44px;flex-wrap:wrap;justify-content:center}
.pat .q{font-family:var(--f-display);color:#C3CCDB;font-size:52px}
.daycard{font-family:var(--f-display);font-size:40px;color:var(--q-lilac);background:#F3EFFF;border-radius:20px;padding:10px 22px}
.qo small.dn{font-size:20px}
@media (min-width:700px){.wp.op{width:110px;height:110px}.wp{width:180px;height:180px}.wp.big{width:240px;height:240px}.qo .oe.big{font-size:80px}.swatch{width:84px;height:84px}.pat{font-size:64px}}
/* white backgrounds everywhere */
body,.phone,.lesson.q2,.introC,#pSettings,.panel,.map{background:#fff!important}
.qvis{box-shadow:0 4px 18px rgba(38,51,77,.08);border:2px solid #EEF2F7}
.qresult{background:#fff}
/* letters, words, reading */
.qo .num.letter{font-size:52px}
.word{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:.5px}
.word.big{font-size:64px;color:var(--q-lilac)}
.sent{font-family:var(--f-display);font-size:30px;text-align:center;line-height:1.4;color:var(--q-ink)}
.sent .gap{display:inline-block;min-width:70px;border-bottom:4px dashed var(--q-sun-d);color:#C3CCDB}
.flash{transition:opacity .4s,filter .4s}.flash.hid{opacity:0;filter:blur(8px)}
.balloon{display:grid;place-items:center;width:84px;height:100px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 40%),var(--bd);position:relative}
.balloon::after{content:"";position:absolute;bottom:-14px;left:50%;width:2px;height:14px;background:#B9C3D3}
@media (min-width:700px){.word{font-size:42px}.word.big{font-size:96px}.sent{font-size:44px}.balloon{width:120px;height:140px}.qo .num.letter{font-size:76px}}

/* Domi picker in the players menu */
.domis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:4px 0 14px}
.dpick{border:3px solid transparent;border-radius:18px;background:#F6F8FC;padding:4px;aspect-ratio:1;display:grid;place-items:center;cursor:pointer}
.dpick img{width:100%;height:100%}
.dpick.on{border-color:var(--q-sun-d,#F5B400);background:#FFF6DA}

/* ===== Nov 8: lively answers, like the Watcher device (cards pop in, float, wiggle, jump when right) ===== */
@keyframes qpop{0%{transform:scale(.4) translateY(30px);opacity:0}60%{transform:scale(1.08) translateY(-6px);opacity:1}80%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes qfloat{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-6px) rotate(-1.2deg)}75%{transform:translateY(4px) rotate(1.2deg)}}
@keyframes qbob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.05)}}
@keyframes qsay{0%,100%{transform:scale(1.06) rotate(0)}30%{transform:scale(1.1) rotate(-2deg)}70%{transform:scale(1.1) rotate(2deg)}}
@keyframes qjump{0%{transform:scale(1)}30%{transform:scale(1.18) translateY(-18px) rotate(-4deg)}55%{transform:scale(.95) translateY(0) rotate(3deg)}75%{transform:scale(1.06)}100%{transform:scale(1.04)}}
@keyframes qno{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-10px) rotate(-4deg)}40%{transform:translateX(10px) rotate(4deg)}60%{transform:translateX(-6px) rotate(-2deg)}80%{transform:translateX(6px) rotate(2deg)}}
@keyframes qsquish{0%{transform:scale(1)}40%{transform:scale(.9,1.05)}70%{transform:scale(1.05,.95)}100%{transform:scale(1)}}
.lesson.q2 .qopts .qo[data-j]{animation:qpop .55s cubic-bezier(.2,1.4,.4,1) both,qfloat 3.6s ease-in-out .6s infinite;will-change:transform}
.lesson.q2 .qopts .qo[data-j]:nth-child(2){animation-delay:.1s,.9s;animation-duration:.55s,4.1s}
.lesson.q2 .qopts .qo[data-j]:nth-child(3){animation-delay:.2s,1.2s;animation-duration:.55s,3.3s}
.lesson.q2 .qopts .qo[data-j]:nth-child(4){animation-delay:.3s,1.5s;animation-duration:.55s,3.9s}
.lesson.q2 .qopts .qo[data-j] .oe,.lesson.q2 .qopts .qo[data-j] .wp,.lesson.q2 .qopts .qo[data-j] .grp,.lesson.q2 .qopts .qo[data-j] .num,.lesson.q2 .qopts .qo[data-j] .word,.lesson.q2 .qopts .qo[data-j] .cshape{animation:qbob 2.4s ease-in-out infinite;display:inline-block}
.lesson.q2 .qopts .qo[data-j]:nth-child(2) .oe,.lesson.q2 .qopts .qo[data-j]:nth-child(2) .wp{animation-delay:.4s}
.lesson.q2 .qopts .qo[data-j]:nth-child(3) .oe,.lesson.q2 .qopts .qo[data-j]:nth-child(3) .wp{animation-delay:.8s}

.pc.up .pcb{transform:rotateY(180deg)}.pc.up .pcf{transform:rotateY(0)}
.pc.got .pcf{border-color:#58CC02;background:#D7FFB8;box-shadow:0 4px 0 #58CC02}
/* put in order */

.odslots i{font-style:normal;color:#AFAFAF;font:900 22px "Nunito",sans-serif}
.ods{position:relative;width:min(19vw,82px);aspect-ratio:1;border-radius:18px;border:3px dashed #CFCFCF;display:grid;place-items:center;font:900 32px "Nunito",sans-serif;color:#4B4B4B}
.ods small{position:absolute;top:-20px;font:800 12px "Nunito",sans-serif;color:#AFAFAF}
.ods.ok{border:3px solid #58CC02;background:#D7FFB8;animation:pop .3s}
.odball{flex:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px;min-height:0;padding:10px 0}
.odb{width:min(24vw,104px);aspect-ratio:.86;border:0;border-radius:50% 50% 46% 46%;background:hsl(var(--h) 85% 60%);color:#fff;font:900 34px "Nunito",sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.18);box-shadow:inset -8px -10px 0 rgba(0,0,0,.12);animation:odFloat 2.6s ease-in-out var(--dl) infinite;position:relative}
.odb::after{content:"";position:absolute;left:50%;bottom:-16px;width:2px;height:16px;background:#BDBDBD}
@keyframes odFloat{50%{transform:translateY(-10px)}}
.odb.wrong{animation:gBump .4s}.odb.gone{visibility:hidden}
/* pizza */

.pzs.on{fill:#FF7A59}

/* build the word */

.bdtop .qspk{width:58px;height:58px;font-size:26px}
.bdpic{width:min(34vw,150px);height:min(34vw,150px);object-fit:contain}
.bdslots{display:flex;justify-content:center;gap:8px}
.bds{width:min(15vw,64px);height:min(17vw,72px);border-bottom:5px solid #CFCFCF;display:grid;place-items:center;font:900 40px "Nunito",sans-serif;color:#4B4B4B}
.bds.ok{border-color:#58CC02;color:#58A700}
.bdtiles{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:10px;min-height:0}

/* ===== Nov 9: parents area - white, Duolingo-like type ===== */
#pSettings{background:#fff;font-family:"Nunito","M PLUS Rounded 1c",system-ui,sans-serif;color:#4B4B4B}
#pSettings *{font-family:inherit}
#pSettings .back{color:#AFAFAF;font-weight:800}
#pSettings .phead b{font:900 28px "Nunito",sans-serif;color:#4B4B4B}
#pSettings .phead .pweek{background:#F7F7F7;color:#AFAFAF;border:2px solid #E5E5E5}
#pSettings .psec{font:800 21px "Nunito",sans-serif;color:#4B4B4B;margin:28px 0 12px}
#pSettings .psec span{background:#fff;border:2px solid #E5E5E5;box-shadow:none}
#pSettings .pt1,#pSettings .pprize,#pSettings .pseg,#pSettings .ptopics button,#pSettings .pages button,#pSettings .pmonths button{background:#fff;border:2px solid #E5E5E5;box-shadow:0 4px 0 #E5E5E5}
#pSettings .pt1 b{font-weight:900;color:#4B4B4B}#pSettings .pt1 small{color:#AFAFAF;font-weight:800}
#pSettings .pchips span{background:#F7F7F7;border:2px solid #E5E5E5;box-shadow:none;color:#777}
#pSettings .ptalk div{border-radius:16px;font-weight:700;background:#FFF5D3;color:#8A6100}
#pSettings .ptalk div+div{background:#DDF4FF;color:#1477A8}
#pSettings .pseg button{color:#AFAFAF;font-weight:800}

#pSettings .plegend span{background:#F7F7F7;border:2px solid #E5E5E5;color:#777}
#pSettings .preset{color:#FF4B4B;font-weight:800}
.pnote{margin:0 0 12px;font-weight:700;font-size:15px;line-height:1.4;color:#777}
/* prizes with a photo */
#pSettings .pprize{grid-template-columns:64px 1fr 1fr auto;grid-template-areas:"pic name name del" "pic ra rw give";row-gap:6px;border-radius:20px}
#pSettings .pprize.ok{border-color:#58CC02;box-shadow:0 4px 0 #58CC02}
.pprize .ppe{grid-area:pic;width:64px;height:64px;border-radius:16px;overflow:hidden;display:grid;place-items:center;background:#F7F7F7;cursor:pointer;font-size:38px}
.pprize .ppr:nth-of-type(1){grid-area:ra}.pprize .ppr:nth-of-type(2){grid-area:rw}
.ppn{grid-area:name;font:800 17px "Nunito",sans-serif;color:#4B4B4B;align-self:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdel{grid-area:del;justify-self:end;border:0;background:transparent;color:#AFAFAF;font-size:18px;font-weight:900;width:34px;height:34px;border-radius:10px}
.pgive,.pdays{grid-area:give;align-self:center}
.pzimg{width:100%;height:100%;object-fit:cover;display:block}
.pze{font-size:inherit;line-height:1}
.padd{width:100%;border:2px dashed #CFCFCF;background:#fff;border-radius:16px;min-height:52px;font:800 17px "Nunito",sans-serif;color:#1CB0F6;margin-top:4px}
.padd.share{border-style:solid;border-color:#E5E5E5;box-shadow:0 4px 0 #E5E5E5;margin-top:10px}
.pzform{display:grid;grid-template-columns:110px 1fr;gap:12px;border:2px solid #E5E5E5;border-radius:20px;padding:12px;margin-top:8px}
.pzpic{width:110px;height:110px;border-radius:18px;border:2px dashed #CFCFCF;display:grid;place-items:center;overflow:hidden;cursor:pointer;background:#F7F7F7;font-size:34px;text-align:center}
.pzpic small{display:block;font:800 12px "Nunito",sans-serif;color:#AFAFAF}
.pzpic img{width:100%;height:100%;object-fit:cover}
.pzf2{display:flex;flex-direction:column;gap:8px;min-width:0}
.pzf2 input{border:2px solid #E5E5E5;border-radius:14px;background:#F7F7F7;min-height:46px;padding:0 12px;font:700 16px "Nunito",sans-serif;color:#4B4B4B;min-width:0}
.pzgoal{display:flex;gap:8px}.pzgoal label{flex:1;display:flex;align-items:center;gap:4px;font-size:20px}
.pzgoal select{flex:1;min-width:0;border:2px solid #E5E5E5;border-radius:12px;min-height:42px;font:800 16px "Nunito",sans-serif;color:#4B4B4B;background:#fff}
.pzf2 small{font-weight:700;color:#AFAFAF;font-size:13px}
.pzbtns{grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr;gap:8px}
/* learning report */
.rsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.rsum div{border:2px solid #E5E5E5;border-radius:16px;padding:8px 4px;text-align:center}
.rsum b{display:block;font:900 26px "Nunito",sans-serif}.rsum small{font-weight:800;font-size:12px;color:#777}
.rsum .rs2 b{color:#58CC02}.rsum .rs1 b{color:#FF9600}.rsum .rs0 b{color:#1CB0F6}
.rtip{border-radius:16px;background:#FFF5D3;padding:10px 12px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rtip b{width:100%;font-weight:900;color:#8A6100}.rtip span{background:#fff;border-radius:999px;padding:4px 10px;font-weight:800;font-size:14px;color:#4B4B4B}
.rtip.up{background:#D7FFB8}.rtip.up b{color:#58A700}.rtip.up span{background:transparent;padding:0;font-weight:700}
.rarea{border:2px solid #E5E5E5;border-radius:18px;padding:6px 12px;margin-top:10px}
.rah{font:900 16px "Nunito",sans-serif;padding:6px 0;color:#4B4B4B}
.rrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px solid #F0F0F0}
.rlv{font-size:22px;width:28px;text-align:center}
.rnm{flex:1;min-width:0}.rnm b{display:block;font-weight:800;font-size:15px}.rnm small{font-weight:700;color:#AFAFAF;font-size:12px}
.rh{display:flex;gap:2px}.rh i{width:6px;height:16px;border-radius:3px;background:#E5E5E5}.rh i.y{background:#58CC02}.rh i.n{background:#FFC800}
/* the child sees the promised toy */
.goalc{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #E5E5E5;border-radius:20px;padding:10px 12px;margin:12px auto 14px;max-width:340px;text-align:left;box-shadow:0 4px 0 #E5E5E5;color:#4B4B4B}
.goalc.close{border-color:#FFC800;box-shadow:0 4px 0 #FFC800;animation:pop 1.2s ease-in-out 2}
.goalc.ok{border-color:#58CC02;box-shadow:0 4px 0 #58CC02}
.goalc .gpic{width:72px;height:72px;flex:0 0 72px;border-radius:16px;overflow:hidden;display:grid;place-items:center;background:#F7F7F7;font-size:44px}
.goalc .gtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.goalc b{font:900 16px "Nunito",sans-serif}
.goalc small{font:800 12px "Nunito",sans-serif;color:#777}
.gbar{display:block;height:10px;border-radius:99px;background:#EFEFEF;overflow:hidden}.gbar i{display:block;height:100%;border-radius:99px}
.gbar.a i{background:#C8803F}.gbar.w i{background:#7A4A1E}
.reveal .goalc{position:relative;z-index:3;margin:6px 16px 10px}
.reveal .item .pzimg.big,.chest .pzimg{width:150px;height:150px;border-radius:28px;object-fit:cover;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.re .pzimg{width:56px;height:56px;border-radius:14px}
.tbtn.hasg{padding:0}
.tbg{width:38px;height:38px;border-radius:50%;background:conic-gradient(#58CC02 var(--f),#E5E5E5 0);display:grid;place-items:center}
.tbg .pzimg.sm,.tbg .pze.sm{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#fff;display:grid;place-items:center;font-size:18px}
/* ===== Nov 9b: answers never cut, one tap is enough =====
   iPad Safari cut the text of cards that grow from a small size or tilt while they float, and the first-child
   max-height clipped big letters and numbers. Cards now slide in (no scaling), stand still, and size their text to the card. */
@keyframes qin2{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes qok{0%,100%{transform:none}40%{transform:translateY(-10px)}}
@keyframes qno2{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes bRise{0%{transform:translateY(40vh);opacity:0}100%{transform:none;opacity:1}}
@keyframes bSway{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes fSwim{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
@keyframes fIn{0%{transform:translateX(-60px);opacity:0}100%{transform:none;opacity:1}}
@keyframes bPop{0%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.lesson.q2 .qopts .qo[data-j]{animation:qin2 .35s ease-out both;will-change:auto;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;container-type:size;overflow:hidden}
.lesson.q2 .qopts .qo[data-j]:nth-child(2){animation-delay:.05s}.lesson.q2 .qopts .qo[data-j]:nth-child(3){animation-delay:.1s}.lesson.q2 .qopts .qo[data-j]:nth-child(4){animation-delay:.15s}
.lesson.q2 .qopts .qo[data-j]:active{animation:none;transform:translateY(3px)}
.lesson.q2 .qopts .qo[data-j].saying{animation:none}
.lesson.q2 .qopts .qo[data-j].right,.lesson.q2 .qopts .qo[data-j].show{animation:qok .5s ease both}
.lesson.q2 .qopts .qo[data-j].wrong{animation:qno2 .4s ease both}
.lesson.q2 .qopts .qo[data-j].faded{transform:none}
.lesson.q2 .qopts .qo[data-j]>:first-child{max-height:none;overflow:visible}
.lesson.q2 .qopts .qo[data-j] *{animation:none!important}
.lesson.q2 .qopts .qo[data-j] b.num{line-height:1.15;font-size:min(46cqh,calc(150cqw / var(--n,2)),120px)}
.lesson.q2 .qopts .qo[data-j] b.num.letter{font-size:min(50cqh,60cqw,120px)}
.lesson.q2 .qopts .qo[data-j] .word{line-height:1.2;font-size:min(30cqh,calc(150cqw / var(--n,4)),64px)}
.lesson.q2 .qopts .qo[data-j] .oe{font-size:min(44cqh,50cqw,100px)!important;line-height:1.15}
.lesson.q2 .qopts .qo[data-j] small{font-size:min(15cqh,calc(150cqw / var(--n,6)),26px);line-height:1.2}
.lesson.q2 .qopts .qo[data-j] .dots{font-size:min(10cqh,calc(90cqw / var(--n,5)),20px);line-height:1.2;white-space:nowrap}
.lesson.q2 .qopts .qo[data-j] .wp.op{height:min(60cqh,160px)!important}
/* balloons and fish move gently up/down or side to side only (no tilting) and keep the word inside */
.lesson.q2 .qopts.st-balloon .qo[data-j]{animation:bRise .7s ease-out both,bSway 3s ease-in-out .7s infinite!important;overflow:visible!important}
.lesson.q2 .qopts.st-balloon .qo[data-j] .word,.lesson.q2 .qopts.st-balloon .qo[data-j] b.num{font-size:min(36cqh,calc(120cqw / var(--n,4)),56px)}
.lesson.q2 .qopts.st-balloon .qo[data-j].right{animation:bPop .45s ease-in forwards!important}
.lesson.q2 .qopts.st-balloon .qo[data-j].wrong,.lesson.q2 .qopts.st-fish .qo[data-j].wrong{animation:qno2 .4s!important}
.lesson.q2 .qopts.st-fish .qo[data-j]{animation:fIn .6s ease-out both,fSwim 3s ease-in-out .6s infinite!important}
.lesson.q2 .qopts.st-fish .qo[data-j].right{animation:qok .5s both!important}
.lesson.q2 .qopts.st-fish .qo[data-j] .word,.lesson.q2 .qopts.st-fish .qo[data-j] b.num{font-size:min(40cqh,calc(110cqw / var(--n,4)),56px)}
.mc{touch-action:manipulation}.mc.sel{animation:none;box-shadow:0 0 0 4px #84D8FF}

/* ===== Nov 9b: the learning report, as pictures ===== */
.rhero{display:flex;align-items:center;gap:14px;border:2px solid #E5E5E5;border-radius:20px;padding:14px;box-shadow:0 4px 0 #E5E5E5}
.rbig{font:900 46px/1 "Nunito",sans-serif;color:#58CC02;text-align:center;min-width:70px}.rbig small{display:block;font:800 14px "Nunito",sans-serif;color:#AFAFAF}
.rht{flex:1;min-width:0}.rht b{font-weight:800;font-size:16px}
.rstack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:#EFEFEF;margin:8px 0 6px;gap:2px}
.rstack i,.rleg i{display:block}.s2{background:#58CC02}.s1{background:#FF9600}.s0{background:#1CB0F6}
.rleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-weight:800;font-size:13px;color:#777}.rleg span{display:flex;align-items:center;gap:5px}.rleg i{width:11px;height:11px;border-radius:50%}
.rweek{border:2px solid #E5E5E5;border-radius:20px;padding:12px 14px 8px;margin-top:12px;box-shadow:0 4px 0 #E5E5E5}
.rwh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.rwh b{font-weight:800}.rwh small{font-weight:700;color:#AFAFAF;font-size:12px}
.rbars{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:130px;margin-top:8px}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;min-width:0}
.rb i{width:70%;max-width:34px;border-radius:8px 8px 4px 4px;background:#E5E5E5;max-height:calc(100% - 40px)}
.rb i.some{background:#84D8FF}.rb i.full{background:#58CC02}
.rbn{font:800 12px "Nunito",sans-serif;color:#777;min-height:14px}.rb small{font:800 12px "Nunito",sans-serif;color:#AFAFAF;height:18px}
.rgoal{display:none}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.rcard{border:2px solid #E5E5E5;border-radius:20px;box-shadow:0 4px 0 #E5E5E5;padding:12px 10px;min-width:0}
.rcard[open]{grid-column:1/-1}
.rcard summary{list-style:none;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-align:center}
.rcard summary::-webkit-details-marker{display:none}
.rring{width:64px;height:64px;border-radius:50%;background:conic-gradient(#58CC02 var(--f),#EFEFEF 0);display:grid;place-items:center}
.rring i{font-style:normal;width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px}
.rcard summary b{font-weight:800;font-size:15px;line-height:1.2}.rcard summary small{font-weight:800;color:#AFAFAF;font-size:12px}
.rlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.rlist span{border-radius:999px;padding:5px 10px;font-weight:800;font-size:13px}
.rlist .l2{background:#D7FFB8;color:#58A700}.rlist .l1{background:#FFF0D5;color:#C76E00}.rlist .l0{background:#DDF4FF;color:#1477A8}
.rhow{font-weight:700;font-size:12px;color:#AFAFAF;line-height:1.5;margin:10px 2px 0}
/* balloons: two rows that always fit the space left under the question, string included */
.lesson.q2 .qopts.st-balloon{container-type:size;flex:1 1 0;min-height:0;grid-template-rows:1fr 1fr!important;grid-auto-rows:auto!important;align-items:start}
.lesson.q2 .qopts.st-balloon .qo[data-j]{min-height:0!important;height:min(calc(50cqh - 34px),calc((50cqw - 20px) / .86))!important;width:auto!important;max-width:100%;max-height:none!important;aspect-ratio:.86;margin:0 auto 0!important;align-self:start!important}
.lesson.q2 .qopts.st-balloon .qo[data-j] .dots,.lesson.q2 .qopts.st-fish .qo[data-j] .dots{display:none}
.lesson.q2 .qopts.st-balloon .balloon{background:none!important;width:auto;height:auto}
.lesson.q2 .qopts.st-balloon .qo[data-j]::before{bottom:-5px}
/* ===== Nov 9c: text sized by script (remove container-unit font sizes that iPad Safari rejects) ===== */
.lesson.q2 .qopts .qo[data-j] b.num,.lesson.q2 .qopts .qo[data-j] b.num.letter,.lesson.q2 .qopts .qo[data-j] .word,.lesson.q2 .qopts.st-balloon .qo[data-j] .word,.lesson.q2 .qopts.st-balloon .qo[data-j] b.num,.lesson.q2 .qopts.st-fish .qo[data-j] .word,.lesson.q2 .qopts.st-fish .qo[data-j] b.num{font-size:40px}
.lesson.q2 .qopts .qo[data-j] small{font-size:19px}
.lesson.q2 .qopts .qo[data-j] .dots{font-size:14px}
.lesson.q2 .qopts .qo[data-j] .oe{font-size:min(64px,7vh)!important}
@media (min-width:700px){.lesson.q2 .qopts .qo[data-j] small{font-size:26px}.lesson.q2 .qopts .qo[data-j] .oe{font-size:min(100px,9vh)!important}.lesson.q2 .qopts .qo[data-j] .dots{font-size:18px}}
/* ===== moving answers: balloons fly up and away, fish swim across ===== */
@keyframes skyRise{from{top:100%}to{top:-42%}}
@keyframes skySway{from{margin-left:-10px}to{margin-left:10px}}
@keyframes seaSwim{from{left:-36%}to{left:104%}}
@keyframes seaBob{from{margin-top:-6px}to{margin-top:6px}}

/* ================= confetti ================= */
const cv=$("fx"),cx=cv.getContext("2d");let parts=[],raf=0;
const COLORS=["#FF8A1F","#FFC72E","#36C25B","#3BA7FF","#FF5468","#A05CF0"];
function size(){const r=$("phone").getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio}
function burstFrom(x,y,n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  size();
  for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,sp=4+Math.random()*9;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,w:6+Math.random()*7,h:4+Math.random()*5,c:COLORS[k%COLORS.length],life:90+Math.random()*40})}
  if(!raf)raf=requestAnimationFrame(tick);
}
function burst(n){const r=$("phone").getBoundingClientRect();burstFrom(r.width/2,r.height*.4,n)}
function burstAt(el,n){if(!el)return;const p=$("phone").getBoundingClientRect(),r=el.getBoundingClientRect();burstFrom(r.left-p.left+r.width/2,r.top-p.top+r.height/2,n)}
function tick(){
  const d=devicePixelRatio;cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life-->0);
  for(const p of parts){p.vy+=.35;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x*d,p.y*d);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.life/30);cx.fillStyle=p.c;cx.fillRect(-p.w*d/2,-p.h*d/2,p.w*d,p.h*d);cx.restore()}
  raf=parts.length?requestAnimationFrame(tick):0;
}
